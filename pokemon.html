<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pokémon Kanto Quest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:#101820; color:#e8e8e8; font-family:'Press Start 2P',monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; }
canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; border:4px solid #2a3a4a; border-radius:8px; box-shadow:0 0 40px rgba(0,0,0,.6); width:min(96vw, calc((100vh - 60px) * 4 / 3)); height:auto; }
#hint { margin-top:10px; font-size:9px; color:#7a8a9a; text-align:center; line-height:1.9; padding:0 16px; }
#hint b { color:#f8d030; font-weight:normal; }
#pad { display:none; width:min(98vw,520px); justify-content:space-between; align-items:center; margin-top:10px; padding:0 16px; }
#pad button { font-family:inherit; color:#fff; background:#34495e; border:2px solid #1c2833; border-radius:10px; -webkit-tap-highlight-color:transparent; touch-action:none; }
#pad button:active, #pad button.on { background:#5d7b99; }
.dpad { display:grid; grid-template-columns:52px 52px 52px; grid-template-rows:52px 52px 52px; }
.dpad button { font-size:16px; }
.dpad .u { grid-column:2; grid-row:1; } .dpad .l { grid-column:1; grid-row:2; }
.dpad .r { grid-column:3; grid-row:2; } .dpad .d { grid-column:2; grid-row:3; }
.st { font-size:9px; padding:10px 12px; border-radius:16px!important; }
.ab { display:flex; gap:14px; align-items:center; }
.ab button { width:62px; height:62px; border-radius:50%!important; font-size:18px; background:#b03a48!important; }
.ab .b { margin-top:34px; }
@media (hover:none), (max-width:700px) {
  #pad { display:flex; } #hint { display:none; }
  canvas { width:min(98vw, calc((100vh - 230px) * 4 / 3)); }
}
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<div id="hint"><b>Arrows/WASD</b> move &nbsp; <b>Z/Space</b> A (confirm/talk) &nbsp; <b>X/Esc</b> B (back) &nbsp; <b>Enter</b> menu &nbsp; hold <b>Shift</b> run &nbsp; <b>N</b> mute</div>
<div id="pad">
  <div class="dpad">
    <button data-k="up" class="u">▲</button><button data-k="left" class="l">◀</button>
    <button data-k="right" class="r">▶</button><button data-k="down" class="d">▼</button>
  </div>
  <button data-k="start" class="st">START</button>
  <div class="ab"><button data-k="b" class="b">B</button><button data-k="a" class="a">A</button></div>
</div>
<script>
'use strict';
// ============================================================
//  CORE
// ============================================================
const W = 640, H = 480, TS = 32;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FONT = "'Press Start 2P', monospace";
const font = (px, g = ctx) => { g.font = px + 'px ' + FONT; };
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

// ---------- tweens / timing (driven by the main loop) ----------
const tweens = [];
function animate(ms, fn) {
  return new Promise(res => tweens.push({ t: 0, ms: Math.max(1, ms), fn: fn || (() => {}), res }));
}
const wait = ms => animate(ms);
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt * 1000;
    const p = Math.min(1, tw.t / tw.ms);
    tw.fn(p);
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

// ---------- input ----------
const Input = {
  held: {}, pressed: {},
  down(k) { if (!this.held[k]) this.pressed[k] = true; this.held[k] = true; audioUnlock(); },
  up(k) { this.held[k] = false; },
  hit(k) { if (this.pressed[k]) { this.pressed[k] = false; return true; } return false; },
  clear() { this.pressed = {}; },
};
const KEYMAP = {
  ArrowUp: ['up'], w: ['up'], W: ['up'], ArrowDown: ['down'], s: ['down'], S: ['down'],
  ArrowLeft: ['left'], a: ['left'], A: ['left'], ArrowRight: ['right'], d: ['right'], D: ['right'],
  z: ['a'], Z: ['a'], ' ': ['a'], Enter: ['a', 'start'],
  x: ['b'], X: ['b'], Escape: ['b', 'start'], Backspace: ['b'],
  Shift: ['run'], m: ['start'], M: ['start'],
};
addEventListener('keydown', e => {
  if (e.key === 'n' || e.key === 'N') { toggleMute(); return; }
  const acts = KEYMAP[e.key];
  if (!acts) return;
  e.preventDefault();
  if (!e.repeat) acts.forEach(k => Input.down(k));
});
addEventListener('keyup', e => { const acts = KEYMAP[e.key]; if (acts) acts.forEach(k => Input.up(k)); });
addEventListener('blur', () => { Input.held = {}; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); Input.down(k); });
  const rel = e => { e.preventDefault(); b.classList.remove('on'); Input.up(k); };
  b.addEventListener('pointerup', rel); b.addEventListener('pointerleave', rel); b.addEventListener('pointercancel', rel);
});

// ---------- audio ----------
let AC = null, muted = false;
function audioUnlock() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } setTimeout(() => Music.want && Music.play(Music.want), 0); }
  if (AC.state === 'suspended') AC.resume();
}
function toggleMute() { muted = !muted; if (muted) Music.stop(); else Music.play(Music.want); }
function tone(freq, dur, type = 'square', vol = 0.06, when = 0, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = 0.15, when = 0) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol; s.connect(g).connect(AC.destination); s.start(AC.currentTime + when);
}
const arp = (notes, step, dur = 0.12, type = 'square', vol = 0.06) => notes.forEach((f, i) => tone(f, dur, type, vol, i * step));
const SFX = {
  blip: () => tone(1046, 0.04, 'square', 0.04),
  select: () => { tone(784, 0.05, 'square', 0.05); tone(1175, 0.07, 'square', 0.05, 0.05); },
  back: () => tone(392, 0.07, 'square', 0.05),
  bump: () => tone(90, 0.09, 'square', 0.07),
  hit: () => noise(0.16, 0.22),
  superHit: () => { noise(0.28, 0.28); tone(220, 0.25, 'sawtooth', 0.07, 0, -160); },
  weakHit: () => noise(0.1, 0.1),
  faint: () => tone(700, 0.7, 'square', 0.06, 0, -620),
  heal: () => arp([523, 659, 784, 1047, 784, 1047], 0.13, 0.14),
  levelUp: () => arp([523, 659, 784, 1047, 1319], 0.08, 0.12),
  statUp: () => arp([400, 500, 600, 800], 0.05, 0.08, 'triangle', 0.08),
  statDown: () => arp([800, 600, 500, 400], 0.05, 0.08, 'triangle', 0.08),
  ball: () => tone(260, 0.35, 'triangle', 0.1, 0, 600),
  shake: () => { tone(160, 0.06, 'square', 0.07); tone(120, 0.06, 'square', 0.07, 0.07); },
  caught: () => arp([784, 988, 1175, 1568], 0.15, 0.18),
  money: () => arp([1319, 1568], 0.07, 0.1),
  encounter: () => arp([330, 311, 330, 311, 330, 392, 440, 523], 0.06, 0.07, 'sawtooth', 0.05),
  status: () => arp([300, 250, 300, 250], 0.06, 0.07, 'sawtooth', 0.05),
  door: () => { noise(0.08, 0.1); tone(200, 0.1, 'square', 0.05, 0.05); },
  evolve: () => arp([392, 523, 659, 784, 1047, 1319, 1568], 0.12, 0.2, 'triangle', 0.09),
};

// ---------- tiny chiptune sequencer (original tunes) ----------
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
const Music = {
  want: null, cur: null, timer: null, step: 0,
  songs: {
    town: { bpm: 132, lead: [72,0,76,79, 77,76,74,0, 71,0,74,77, 76,74,72,0, 72,74,76,72, 79,0,77,76, 74,76,77,74, 72,0,0,0],
            bass: [48,55,52,55, 50,57,53,57, 47,55,50,55, 48,55,52,55] },
    route: { bpm: 150, lead: [67,69,71,74, 0,71,74,76, 79,0,76,74, 71,0,69,0, 67,69,71,67, 64,0,67,69, 71,74,72,71, 69,0,0,0],
             bass: [43,50,43,50, 40,47,40,47, 45,52,45,52, 38,45,38,45] },
    battle: { bpm: 176, lead: [69,72,76,72, 81,76,72,76, 68,71,76,71, 80,76,71,76, 65,69,72,69, 77,72,69,72, 64,68,71,74, 76,0,74,71],
              bass: [45,45,57,45, 44,44,56,44, 41,41,53,41, 40,40,52,40] },
    victory: { bpm: 140, lead: [72,76,79,84, 0,83,84,0, 81,79,77,79, 76,0,0,0], bass: [48,48,52,52, 53,53,55,55] },
  },
  play(name) {
    this.want = name;
    if (muted || !AC || this.cur === name) return;
    this.stop(); this.cur = name; this.step = 0;
    const s = this.songs[name]; if (!s) return;
    const dt = 60 / s.bpm / 2;
    this.timer = setInterval(() => {
      if (muted || !AC) return;
      const l = s.lead[this.step % s.lead.length];
      if (l) tone(NOTE(l), dt * 0.9, 'square', 0.025);
      if (this.step % 2 === 0) { const b = s.bass[(this.step / 2) % s.bass.length]; if (b) tone(NOTE(b), dt * 1.8, 'triangle', 0.05); }
      this.step++;
    }, dt * 1000);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.cur = null; },
};

// ============================================================
//  DATA: TYPES & MOVES
// ============================================================
const TYPE_CHART = {

  Water: { Fire: 2, Water: .5, Grass: .5, Ground: 2, Rock: 2 },
  Grass: { Fire: .5, Water: 2, Grass: .5, Poison: .5, Ground: 2, Flying: .5, Bug: .5, Rock: 2 },
  Electric: { Water: 2, Electric: .5, Grass: .5, Ground: 0, Flying: 2 },
  Poison: { Grass: 2, Poison: .5, Ground: .5, Rock: .5 },
  Ground: { Fire: 2, Electric: 2, Grass: .5, Poison: 2, Flying: 0, Bug: .5, Rock: 2 },
  Flying: { Electric: .5, Grass: 2, Bug: 2, Rock: .5 },
  Psychic: { Poison: 2, Psychic: .5, Dark: 0 },
  Bug: { Fire: .5, Grass: 2, Poison: .5, Flying: .5, Psychic: 2, Dark: 2 },
  Rock: { Fire: 2, Ground: .5, Flying: 2, Bug: 2 },
  Dark: { Psychic: 2, Dark: .5 },
};
const TYPE_COLOR = { Normal: '#a8a878', Fire: '#f08030', Water: '#6890f0', Grass: '#78c850', Electric: '#f8d030', Poison: '#a040a0',
  Ground: '#e0c068', Flying: '#a890f0', Psychic: '#f85888', Bug: '#a8b820', Rock: '#b8a038', Dark: '#705848', None: '#888' };
function effectiveness(mtype, defTypes) {
  const row = TYPE_CHART[mtype] || {};
  return defTypes.reduce((m, t) => m * (row[t] ?? 1), 1);
}
// c: p=physical s=special st=status | p: power | a: accuracy (null = never misses)
// fx: primary effect of status moves | sec: secondary effect chance on damaging moves
const MOVES = {
  tackle: { n: 'TACKLE', t: 'Normal', c: 'p', p: 40, a: 100, pp: 35 },
  scratch: { n: 'SCRATCH', t: 'Normal', c: 'p', p: 40, a: 100, pp: 35 },
  quickattack: { n: 'QUICK ATTACK', t: 'Normal', c: 'p', p: 40, a: 100, pp: 30, pri: 1 },

  absorb: { n: 'ABSORB', t: 'Grass', c: 's', p: 20, a: 100, pp: 25, drain: .5 },

};
const STAT_NAME = { atk: 'ATTACK', def: 'DEFENSE', spa: 'SP. ATK', spd: 'SP. DEF', spe: 'SPEED' };
const STATUS_TAG = { psn: ['PSN', '#a040a0'], par: ['PAR', '#c8a000'], slp: ['SLP', '#888'], brn: ['BRN', '#e05020'] };

// ============================================================
//  SPRITES (drawn procedurally into a 56x56 pixel canvas)
// ============================================================
const mk = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function E(g, x, y, rx, ry, c, rot = 0) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); }
function P(g, c, ...p) { g.fillStyle = c; g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); g.fill(); }
function L(g, c, w, ...p) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.stroke(); }
function EYE(g, x, y, r = 3, iris = '#222') { E(g, x, y, r, r * 1.2, '#fff'); E(g, x + .5, y + .4, r * .72, r * .95, iris); E(g, x + .6, y + .6, r * .38, r * .5, '#000'); E(g, x - .5, y - .8, r * .32, r * .32, '#fff'); }

const DRAW = {
  bulbasaur: g => bulba(g, 0), ivysaur: g => bulba(g, 1),
  charmander: g => charm(g, 0), charmeleon: g => charm(g, 1),
  squirtle: g => squirt(g, 0), wartortle: g => squirt(g, 1),
  pidgey: g => bird(g, 0), pidgeotto: g => bird(g, 1),
  rattata: g => rat(g, 0), raticate: g => rat(g, 1),
  caterpie: g => worm(g, '#88c848', '#f0e060', 0), weedle: g => worm(g, '#d8a050', '#f0d8a0', 1),
  metapod: g => cocoon(g, '#70b040', '#4a8a2a'), kakuna: g => cocoon(g, '#e8c840', '#b89820'),
  butterfree: g => {
    E(g, 15, 20, 13, 11, '#f4f4f4', -.5); E(g, 41, 20, 13, 11, '#f4f4f4', .5);
    E(g, 17, 37, 9, 7, '#f4f4f4', .4); E(g, 39, 37, 9, 7, '#f4f4f4', -.4);
    L(g, '#333', 1.6, 26, 28, 8, 14); L(g, '#333', 1.6, 30, 28, 48, 14); L(g, '#333', 1.4, 26, 32, 12, 38); L(g, '#333', 1.4, 30, 32, 44, 38);
    E(g, 28, 32, 6, 12, '#5a58b0'); E(g, 28, 18, 8, 7, '#5a58b0');
    E(g, 24, 18, 3.6, 4.2, '#e83a58'); E(g, 32, 18, 3.6, 4.2, '#e83a58'); E(g, 23, 17, 1.2, 1.2, '#fff'); E(g, 31, 17, 1.2, 1.2, '#fff');
    L(g, '#333', 1.5, 25, 12, 20, 3); L(g, '#333', 1.5, 31, 12, 36, 3); L(g, '#f0f0f0', 1.6, 24, 44, 22, 50); L(g, '#f0f0f0', 1.6, 32, 44, 34, 50);
  },
  beedrill: g => {
    E(g, 14, 16, 11, 6, '#d0eef8', -.3); E(g, 42, 16, 11, 6, '#d0eef8', .3);
    E(g, 34, 40, 8, 10, '#f0c830', -.3); L(g, '#222', 2.5, 28, 37, 40, 34); L(g, '#222', 2.5, 29, 43, 41, 41); P(g, '#eee', 36, 49, 40, 55, 41, 47);
    E(g, 28, 28, 6, 6, '#222'); E(g, 24, 18, 8, 7, '#f0c830');
    E(g, 20, 17, 3.2, 3.8, '#e03030'); E(g, 28, 16, 3.2, 3.8, '#e03030');
    P(g, '#ddd', 18, 26, 4, 40, 20, 31); P(g, '#ddd', 34, 26, 50, 40, 36, 31);
    L(g, '#222', 1.5, 22, 12, 16, 4); L(g, '#222', 1.5, 27, 11, 30, 3);
  },
  pikachu: g => {

const SPR = {};
function buildSprite(sp) {
  const S = 56, base = mk(S), g = base.getContext('2d');
  DRAW[sp](g);
  const id = g.getImageData(0, 0, S, S), d = id.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 110 ? 255 : 0;
  g.putImageData(id, 0, 0);
  const tint = (src, c) => { const s = mk(S), sg = s.getContext('2d'); sg.drawImage(src, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = c; sg.fillRect(0, 0, S, S); return s; };
  const dark = tint(base, '#181818'), out = mk(S), og = out.getContext('2d');
  [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([x, y]) => og.drawImage(dark, x, y));
  og.drawImage(base, 0, 0);
  return { n: out, w: tint(out, '#ffffff'), k: tint(out, '#283038') };
}
// draws a POKéMON sprite with (x, y) at its bottom-centre
function drawMon(g, sp, x, y, scale, o = {}) {
  if (!SPR[sp]) SPR[sp] = buildSprite(sp);
  const img = SPR[sp][o.kind || 'n'], s = 56 * scale;
  g.save(); g.imageSmoothingEnabled = false;
  if (o.alpha != null) g.globalAlpha = o.alpha;
  g.translate(Math.round(x), Math.round(y));
  if (o.flip) g.scale(-1, 1);
  const sy = o.squash ?? 1;
  g.drawImage(img, -s / 2, -s * sy, s, s * sy);
  g.restore();
}

//  POKéMON INSTANCES
// ============================================================
const xpFor = lv => lv <= 1 ? 0 : lv * lv * lv;
const mname = m => m.nick || SPECIES[m.sp].n;
const alive = m => m.hp > 0;
function calcStats(m) {
  const b = SPECIES[m.sp].b, f = i => Math.floor((2 * b[i] + m.iv[i]) * m.lv / 100);
  m.st = { hp: f(0) + m.lv + 10, atk: f(1) + 5, def: f(2) + 5, spa: f(3) + 5, spd: f(4) + 5, spe: f(5) + 5 };
}
function makeMon(sp, lv) {
  const m = { sp, lv, xp: xpFor(lv), iv: Array.from({ length: 6 }, () => rnd(32)), moves: [], status: null, slp: 0 };
  calcStats(m); m.hp = m.st.hp;
  const known = [];
  SPECIES[sp].ls.filter(([l]) => l <= lv).forEach(([, id]) => { if (!known.includes(id)) known.push(id); });
  m.moves = known.slice(-4).map(id => ({ id, pp: MOVES[id].pp }));
  return m;
}
function healMon(m) { m.hp = m.st.hp; m.status = null; m.slp = 0; m.moves.forEach(mv => mv.pp = MOVES[mv.id].pp); }

    G.seen[m.sp] = 1;

  }
  async recall(s) {

  }
  async lunge(s) {

  async chooseMove() {
    const ms = this.P.mon.moves;

    const items = ms.map(m => ({ label: MOVES[m.id].n, disabled: m.pp <= 0 }));
    const extra = (g, i) => {

      g.fillStyle = '#88a8c8'; g.fillRect(448, H - 112, 2, 96);

Object.assign(Battle.prototype, {
  async run() {
    await animate(650, p => { this.intro = p; });
    if (this.wild) {
      this.F.mon = this.wild; this.F.hpD = this.wild.hp; this.F.vis = { s: 1, alpha: 1, dx: 0, dy: 0, white: false, hidden: false };
      G.seen[this.wild.sp] = 1; tone(380, 0.3, 'sawtooth', 0.05, 0, -120);
      await this.msg(`A wild ${mname(this.wild)} appeared!`);
    } else {
      await this.msg(`${this.tr.name} wants to battle!`);
      await animate(300, p => { this.trainerX = p; });
      await this.msg(`${this.tr.name} sent out ${mname(this.foes[0])}!`);
      await this.sendOut(this.F, this.foes[0], false);
    }
    const first = G.party.find(alive);
    await this.msg(`Go! ${mname(first)}!`);
    await animate(250, p => { this.playerX = p; });
    await this.sendOut(this.P, first, true);
    while (true) {
      const act = await this.chooseAction();
      const r = await this.turn(act);
      if (r) return this.finish(r);
    }
  },
  async finish(r) {
    if (r === 'win' && this.tr) {
      Music.play('victory');
      await this.msg(`${G.name} defeated ${this.tr.name}!`);
      this.F.vis.hidden = true; await animate(300, p => { this.trainerX = 1 - p; });
      await say(this.tr.lose);
      const money = this.tr.money * this.foes[this.foes.length - 1].lv;
      G.money += money; SFX.money();
      await say(`${G.name} got $${money} for winning!`);
    } else if (r === 'win') Music.play('victory');
    if (r === 'lose') {
      await this.msg(`${G.name} is out of usable POKéMON!`);
      if (!this.o.noBlackout) await say(`${G.name} blacked out!`);
    }
    return r;
  },
  pickFoeMove() {
    const ms = this.F.mon.moves.filter(m => m.pp > 0);
    if (!ms.length) return 'struggle';
    if (this.wild || Math.random() < 0.25) return pick(ms);
    const d = this.P.mon, score = m => {
      const mv = MOVES[m.id];
      if (mv.c === 'st') return mv.fx.status ? (d.status ? 0 : 45) : 25;
      return mv.p * effectiveness(mv.t, SPECIES[d.sp].t) * (SPECIES[this.F.mon.sp].t.includes(mv.t) ? 1.5 : 1);
    };
    return ms.reduce((a, b) => score(b) > score(a) ? b : a);
  },
  playerFirst(pm, fm) {
    const pp = pm === 'struggle' ? 0 : MOVES[pm.id].pri || 0, fp = fm === 'struggle' ? 0 : MOVES[fm.id].pri || 0;
    if (pp !== fp) return pp > fp;
    const ps = this.stat(this.P, 'spe'), fs = this.stat(this.F, 'spe');
    return ps === fs ? Math.random() < .5 : ps > fs;
  },
  async turn(act) {
    const P = this.P, F = this.F, fm = this.pickFoeMove();
    if (act.type === 'run') {
      this.runs++;
      const ps = this.stat(P, 'spe'), fs = this.stat(F, 'spe');
      if (ps >= fs || rnd(256) < (ps * 128 / fs + 30 * this.runs) % 256) { SFX.door(); await this.msg('Got away safely!'); return 'ran'; }
      await this.msg('Can\'t escape!');
    } else if (act.type === 'switch') {
      await this.msg(`${mname(P.mon)}, come back!`); await this.recall(P);
      await this.msg(`Go! ${mname(G.party[act.idx])}!`); await this.sendOut(P, G.party[act.idx], true);
    } else if (act.type === 'item') {
      if (await this.useItem(act) === 'caught') return 'caught';
    }
    const order = act.type !== 'move' ? [[F, P, fm]] : this.playerFirst(act.mv, fm) ? [[P, F, act.mv], [F, P, fm]] : [[F, P, fm], [P, F, act.mv]];
    for (const [a, d, mv] of order) {
      if (!alive(a.mon)) continue;
      await this.doMove(a, d, mv);
      const r = await this.checkFaints();
      if (r === 'replaced') return null;
      if (r) return r;
    }
    for (const s of [P, F]) {
      const m = s.mon;
      if (!alive(m) || (m.status !== 'psn' && m.status !== 'brn')) continue;
      await this.msg(`${this.nameOf(s)} is hurt by ${m.status === 'psn' ? 'poison' : 'its burn'}!`);
      SFX.weakHit(); await this.blink(s);
      await this.damage(s, Math.max(1, Math.floor(m.st.hp / (m.status === 'psn' ? 8 : 16))));
    }
    const r = await this.checkFaints();
    return r === 'replaced' ? null : r;
  },
  async doMove(a, d, slot) {
    const m = a.mon, nm = this.nameOf(a);
    if (m.status === 'slp') {
      if (--m.slp <= 0) { m.status = null; await this.msg(`${nm} woke up!`); }
      else { await this.msg(`${nm} is fast asleep.`); return; }
    }
    if (m.status === 'par' && Math.random() < .25) { await this.msg(`${nm} is paralyzed! It can't move!`); return; }
    const id = slot === 'struggle' ? 'struggle' : slot.id, mv = MOVES[id];
    if (slot !== 'struggle') slot.pp = Math.max(0, slot.pp - 1);
    await this.msg(`${nm} used ${mv.n}!`);
    if (mv.a != null && Math.random() * 100 >= mv.a) { await this.msg(`${nm}'s attack missed!`); return; }
    const dn = this.nameOf(d), types = SPECIES[d.mon.sp].t;
    if (mv.c === 'st') {
      if (mv.fx.status && (effectiveness(mv.t, types) === 0 || (mv.powder && types.includes('Grass')))) { await this.msg(`It doesn't affect ${dn}...`); return; }
      if (!mv.fx.self) await this.lunge(a);
      return this.applyFx(a, d, mv.fx, false);
    }
    const eff = mv.t === 'None' ? 1 : effectiveness(mv.t, types);
    if (eff === 0) { await this.msg(`It doesn't affect ${dn}...`); return; }
    const crit = Math.random() < (mv.crit ? 1 / 8 : 1 / 16);
    const dmg = Math.min(d.mon.hp, this.calcDamage(a, d, mv, eff, crit));
    await this.lunge(a);
    (eff > 1 ? SFX.superHit : eff < 1 ? SFX.weakHit : SFX.hit)();
    await this.blink(d);
    await this.damage(d, dmg);
    if (crit) await this.msg('A critical hit!');
    if (eff > 1) await this.msg('It\'s super effective!'); else if (eff < 1) await this.msg('It\'s not very effective...');
    if (mv.drain && alive(a.mon) && a.mon.hp < a.mon.st.hp) { await this.heal(a, Math.max(1, Math.floor(dmg * mv.drain))); await this.msg(`${dn} had its energy drained!`); }
    if (mv.recoil) { await this.damage(a, Math.max(1, Math.floor(a.mon.st.hp * mv.recoil))); await this.msg(`${nm} is hit with recoil!`); }
    if (mv.sec && alive(d.mon) && Math.random() * 100 < mv.sec.ch) await this.applyFx(a, d, mv.sec, true);
  },
  calcDamage(a, d, mv, eff, crit) {
    const phys = mv.c === 'p', ak = phys ? 'atk' : 'spa', dk = phys ? 'def' : 'spd';
    let A = this.stat(a, ak), D = this.stat(d, dk);
    if (crit) { A = Math.max(A, a.mon.st[ak]); D = Math.min(D, d.mon.st[dk]); }
    let dmg = Math.floor(Math.floor(Math.floor(2 * a.mon.lv / 5 + 2) * mv.p * A / D) / 50) + 2;
    if (phys && a.mon.status === 'brn') dmg = Math.floor(dmg / 2);
    const stab = SPECIES[a.mon.sp].t.includes(mv.t) ? 1.5 : 1;
    return Math.max(1, Math.floor(dmg * stab * eff * (crit ? 1.5 : 1) * (0.85 + Math.random() * 0.15)));
  },
  async applyFx(a, d, fx, secondary) {
    if (fx.stat) {
      const s = fx.self ? a : d, cur = s.stages[fx.stat] || 0, nv = clamp(cur + fx.n, -6, 6), nm = this.nameOf(s), st = STAT_NAME[fx.stat];
      if (nv === cur) { if (!secondary) await this.msg(`${nm}'s ${st} won't go any ${fx.n > 0 ? 'higher' : 'lower'}!`); return; }
      s.stages[fx.stat] = nv;
      (fx.n > 0 ? SFX.statUp : SFX.statDown)(); await this.shake(s);
      const how = fx.n > 1 ? 'sharply rose' : fx.n > 0 ? 'rose' : fx.n < -1 ? 'harshly fell' : 'fell';
      return this.msg(`${nm}'s ${st} ${how}!`);
    }
    if (fx.status) {
      const m = d.mon, nm = this.nameOf(d), t = SPECIES[m.sp].t;
      const immune = (fx.status === 'psn' && t.includes('Poison')) || (fx.status === 'brn' && t.includes('Fire')) || (fx.status === 'par' && t.includes('Electric'));
      if (m.status || immune) { if (!secondary) await this.msg(m.status === fx.status ? `${nm} is already ${{ psn: 'poisoned', par: 'paralyzed', slp: 'asleep', brn: 'burned' }[fx.status]}!` : 'But it failed!'); return; }
      m.status = fx.status; if (fx.status === 'slp') m.slp = 2 + rnd(3);
      SFX.status(); await this.shake(d);
      return this.msg(`${nm} ${{ psn: 'was poisoned!', par: 'is paralyzed! It may be unable to move!', slp: 'fell asleep!', brn: 'was burned!' }[fx.status]}`);
    }
  },
  async checkFaints() {
    const P = this.P, F = this.F;
    let res = null;
    if (!alive(F.mon) && !F.fainted) {
      F.fainted = true; SFX.faint(); F.vis.clip = true;
      await animate(450, p => { F.vis.dy = p * 120; });
      F.vis.hidden = true; F.vis.dy = 0; F.vis.clip = false;
      await this.msg(`${this.nameOf(F)} fainted!`);
      await this.giveXP();
      const next = this.foes.find(alive);
      if (!next) return 'win';
      await this.msg(`${this.tr.name} sent out ${mname(next)}!`);
      await this.sendOut(F, next, false);
      res = 'replaced';
    }
    if (!alive(P.mon) && !P.vis.hidden) {
      SFX.faint(); P.vis.clip = true;
      await animate(450, p => { P.vis.dy = p * 150; });
      P.vis.hidden = true; P.vis.dy = 0; P.vis.clip = false;
      await this.msg(`${mname(P.mon)} fainted!`);
      this.parts.delete(P.mon);
      if (!G.party.some(alive)) return 'lose';
      const idx = await partyMenu('forced', this);
      await this.msg(`Go! ${mname(G.party[idx])}!`);
      await this.sendOut(P, G.party[idx], true);
      res = 'replaced';
    }

  },
  async giveXP() {
    const F = this.F, parts = [...this.parts].filter(m => alive(m) && G.party.includes(m));
    if (!parts.length) return;
    const each = Math.max(1, Math.floor(SPECIES[F.mon.sp].xp * F.mon.lv / 7 * (this.tr ? 1.5 : 1) * XP_MULT / parts.length));
    for (const m of parts) {
      await this.msg(`${mname(m)} gained ${each} EXP. Points!`);

      while (left > 0 && m.lv < 100) {

  },
  async useItem(act) {
    const it = ITEMS[act.id];
    if (it.ball) {
      if (this.tr) { await say(['The trainer blocked the BALL!', 'Don\'t be a thief!']); return; }
      useItem(act.id);
      await this.msg(`${G.name} used ${it.n}!`);
      return this.throwBall(it.ball);
    }
    useItem(act.id);
    const m = G.party[act.target], s = m === this.P.mon ? this.P : null;
    if (it.heal) {
      if (s) { const h = await this.heal(s, it.heal); SFX.heal(); await this.msg(`${mname(m)}'s HP was restored by ${h} points.`); }
      else { const h = Math.min(it.heal, m.st.hp - m.hp); m.hp += h; SFX.heal(); await this.msg(`${mname(m)}'s HP was restored by ${h} points.`); }
    } else if (it.cure) { m.status = null; m.slp = 0; SFX.heal(); await this.msg(`${mname(m)} was cured of its status problem!`); }
  },
  async throwBall(mult) {
    const F = this.F, m = F.mon;
    this.ball = { x: 120, y: 320 };
    SFX.ball();
    await animate(550, p => { this.ball.x = 120 + p * 350; this.ball.y = 320 - p * 210 - Math.sin(p * Math.PI) * 120; });
    F.vis.white = true; SFX.select();
    await animate(250, p => { F.vis.s = 1 - p; });
    F.vis.hidden = true; F.vis.s = 1; F.vis.white = false;
    await animate(250, p => { this.ball.y = 110 + p * 50; });
    const sb = m.status === 'slp' ? 2 : m.status ? 1.5 : 1;
    const a = Math.floor((3 * m.st.hp - 2 * m.hp) * SPECIES[m.sp].cr * mult / (3 * m.st.hp) * sb);
    const b = a >= 255 ? 65536 : 1048560 / Math.sqrt(Math.sqrt(16711680 / Math.max(1, a)));

    while (shakes < 4 && rnd(65536) < b) shakes++;
    for (let i = 0; i < Math.min(3, shakes); i++) {
      await wait(350); SFX.shake();
      const x0 = this.ball.x; await animate(300, p => { this.ball.x = x0 + Math.sin(p * Math.PI * 2) * 8; });
    }
    if (shakes >= 4) {
      await wait(300); SFX.caught(); Music.play('victory');
      await this.msg(`Gotcha! ${mname(m)} was caught!`);
      const isNew = !G.caught[m.sp];
      registerCaught(m); this.ball = null;
      if (isNew) await say(`${mname(m)}'s data was added to the POKéDEX.`);
      if (G.party.length < 6) G.party.push(m);
      else { G.box.push(m); await say(`${mname(m)} was sent to the PC BOX.`); }
      return 'caught';
    }
    await wait(250); this.ball = null; F.vis.hidden = false; F.vis.white = true; SFX.select();
    await animate(200, p => { F.vis.s = p; }); F.vis.white = false;
    await this.msg(['Oh no! The POKéMON broke free!', 'Aww! It appeared to be caught!', 'Aargh! Almost had it!', 'Shoot! It was so close, too!'][shakes]);
  },
});

// ---------- leveling, learning, evolving ----------
async function levelUp(m, battle) {
  const old = { ...m.st };
  m.lv++; calcStats(m); m.hp = Math.min(m.st.hp, m.hp + m.st.hp - old.hp);
  if (battle && m === battle.P.mon) battle.P.hpD = m.hp;
  SFX.levelUp();
  const d = k => `${k === 'hp' ? 'HP ' : k.toUpperCase()}+${m.st[k] - old[k]}`;
  await say([`${mname(m)} grew to Lv. ${m.lv}!`, `${d('hp')}  ${d('atk')}  ${d('def')}\n${d('spa')}  ${d('spd')}  ${d('spe')}`]);
  for (const [l, id] of SPECIES[m.sp].ls) if (l === m.lv) await learnMove(m, id);
  const e = SPECIES[m.sp].evo;
  if (e && m.lv >= e.lv) m.evoPending = true;
}
async function learnMove(m, id) {
  if (m.moves.some(x => x.id === id)) return;
  const nm = mname(m), mv = MOVES[id].n;
  if (m.moves.length < 4) { m.moves.push({ id, pp: MOVES[id].pp }); SFX.levelUp(); await say(`${nm} learned ${mv}!`); return; }
  while (true) {
    if (await yesNo(`${nm} wants to learn ${mv}, but already knows 4 moves. Forget a move for ${mv}?`)) {
      const i = await ask('Which move should be forgotten?', m.moves.map(x => MOVES[x.id].n), { w: 300 });
      if (i >= 0) {
        const old = MOVES[m.moves[i].id].n; m.moves[i] = { id, pp: MOVES[id].pp }; SFX.levelUp();
        await say(['1, 2, and... Poof!', `${nm} forgot ${old}. And... ${nm} learned ${mv}!`]);
        return;
      }
    }
    if (await yesNo(`Stop trying to teach ${mv}?`)) { await say(`${nm} did not learn ${mv}.`); return; }
  }
}
class EvoScene {
  constructor(m) { this.m = m; this.sp = m.sp; this.white = false; this.t = 0; this.flash = 0; }
  update(dt) { this.t += dt; if (this.flash > 0) this.flash -= dt * 2; }
  draw(g) {
    const bg = g.createRadialGradient(W / 2, 230, 20, W / 2, 230, 400);
    bg.addColorStop(0, '#384878'); bg.addColorStop(1, '#101828'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2 + this.t * .6, r = 130 + Math.sin(this.t * 3 + i) * 30;
      g.fillStyle = i % 2 ? '#f8f0a0' : '#a0d8f8'; g.fillRect(W / 2 + Math.cos(a) * r, 220 + Math.sin(a) * r * .7, 4, 4);
    }
    drawMon(g, this.sp, W / 2, 320, 3.4, { kind: this.white ? 'w' : 'n' });
    if (this.flash > 0) { g.fillStyle = `rgba(255,255,255,${this.flash})`; g.fillRect(0, 0, W, H); }
  }
}
async function checkEvolutions() {
  for (const m of G.party) {
    const e = SPECIES[m.sp].evo;
    if (!m.evoPending) continue;
    m.evoPending = false;
    if (!e || m.lv < e.lv) continue;
    const s = push(new EvoScene(m)), old = mname(m);
    Music.stop();
    await say(`What? ${old} is evolving!`);
    s.white = true;
    for (let i = 0; i < 16; i++) { s.sp = i % 2 ? e.to : m.sp; tone(300 + i * 40, 0.08, 'triangle', 0.06); await wait(Math.max(70, 420 - i * 26)); }
    s.sp = e.to; s.flash = 1; s.white = false; SFX.evolve();
    const hpLost = m.st.hp - m.hp; m.sp = e.to; calcStats(m); m.hp = Math.max(1, m.st.hp - hpLost); registerCaught(m);
    await wait(500);
    await say(`Congratulations! Your ${old} evolved into ${SPECIES[e.to].n}!`);
    for (const [l, id] of SPECIES[e.to].ls) if (l === 0 || l === m.lv) await learnMove(m, id);
    remove(s);
  }
}

function menuBg(g, c1 = '#3870a8', c2 = '#5898d0') {
  g.fillStyle = c1; g.fillRect(0, 0, W, H);
  g.fillStyle = c2; for (let y = 0; y < H; y += 32) for (let x = (y / 32) % 2 * 32; x < W; x += 64) g.fillRect(x, y, 32, 32);
}
class PartyScene {
  constructor(mode, battle, res) {
    this.mode = mode; this.battle = battle; this.res = res; this.swapFrom = -1; this.busy = false;
    this.i = mode === 'forced' ? Math.max(0, G.party.findIndex(alive)) : 0;
  }
  update(dt, top) {
    if (!top || this.busy) return;
    const n = G.party.length, old = this.i;
    if (Input.hit('up') && this.i >= 2) this.i -= 2;
    if (Input.hit('down') && this.i + 2 < n) this.i += 2;
    if (Input.hit('left') && this.i % 2) this.i--;
    if (Input.hit('right') && this.i % 2 === 0 && this.i + 1 < n) this.i++;
    if (old !== this.i) SFX.blip();
    if (Input.hit('b')) {
      if (this.swapFrom >= 0) { this.swapFrom = -1; SFX.back(); return; }
      if (this.mode === 'forced') { SFX.bump(); return; }
      SFX.back(); remove(this); this.res(null); return;
    }
    if (Input.hit('a')) { SFX.select(); this.busy = true; this.onA().finally(() => { this.busy = false; Input.clear(); }); }
  }
  async onA() {
    const m = G.party[this.i];
    if (this.swapFrom >= 0) { const a = this.swapFrom; [G.party[a], G.party[this.i]] = [G.party[this.i], G.party[a]]; this.swapFrom = -1; return; }
    if (this.mode === 'item') { remove(this); this.res(this.i); return; }
    const opts = this.mode === 'field' ? ['SUMMARY', 'SWITCH', 'CANCEL'] : this.mode === 'battle' ? ['SHIFT', 'SUMMARY', 'CANCEL'] : ['SHIFT', 'SUMMARY'];
    const k = await choose(opts, { x: W - 236, y: H - 128 - (opts.length * 36 + 32), w: 228 });
    const o = opts[k];
    if (o === 'SUMMARY') await showSummary(this.i);
    else if (o === 'SWITCH') this.swapFrom = this.i;
    else if (o === 'SHIFT') {
      if (!alive(m)) return say('There\'s no will to fight!');
      if (this.battle && m === this.battle.P.mon) return say(`${mname(m)} is already in battle!`);
      remove(this); this.res(this.i);
    }
  }
  draw(g) {
    menuBg(g);
    G.party.forEach((m, k) => {
      const x = 16 + (k % 2) * 308, y = 16 + Math.floor(k / 2) * 106, sel = k === this.i;
      g.fillStyle = sel ? '#f8d048' : '#284060'; rr(g, x, y, 300, 98, 12); g.fill();
      g.fillStyle = !alive(m) ? '#e8b0a8' : k === this.swapFrom ? '#b8f0b0' : this.battle && m === this.battle.P.mon ? '#c8e0f8' : '#a8d8f8';
      rr(g, x + 4, y + 4, 292, 90, 9); g.fill();
      drawMon(g, m.sp, x + 44, y + 84, 1.25);
      text(g, mname(m), x + 86, y + 14, 12);
      text(g, 'Lv' + m.lv, x + 86, y + 36, 10);
      statusBadge(g, m.status, x + 150, y + 32);
      hpBar(g, x + 120, y + 58, 160, m.hp, m.st.hp, 8);
      text(g, 'HP', x + 90, y + 58, 8, '#f8a030', 'left', null);
      text(g, `${m.hp}/${m.st.hp}`, x + 282, y + 74, 10, '#303030', 'right');
    });
    box(g, 8, H - 120, W - 16, 112);
    const p = this.swapFrom >= 0 ? 'Move to where?' : this.mode === 'item' ? 'Use on which POKéMON?' : this.mode === 'forced' ? 'Choose the next POKéMON.' : 'Choose a POKéMON.';
    text(g, p, 36, H - 90, 16);
    if (this.mode !== 'forced') text(g, 'B: CANCEL', W - 40, H - 46, 10, '#808080', 'right', null);
  }
}

class Panel { constructor(draw) { this.d = draw; } update() {} draw(g) { this.d(g); } }
const BAG_ORDER = ['potion', 'superpotion', 'fullheal', 'pokeball', 'greatball'];
async function bagMenu(battle) {
  const bg = push(new Panel(g => {
    menuBg(g, '#c89048', '#d8a058');
    g.fillStyle = '#7a5028'; rr(g, 40, 70, 200, 220, 26); g.fill(); g.fillStyle = '#a87038'; rr(g, 52, 90, 176, 190, 18); g.fill();
    g.fillStyle = '#7a5028'; rr(g, 96, 40, 88, 50, 20); g.fill(); g.fillStyle = '#c89048'; rr(g, 112, 52, 56, 30, 12); g.fill();
    text(g, 'BAG', 140, 160, 20, '#f8e8c0', 'center', '#5a3818');
    text(g, '$' + G.money, 140, 196, 12, '#f8e8c0', 'center', '#5a3818');
  }));
  try {
    while (true) {
      const ids = BAG_ORDER.filter(id => G.bag[id] > 0);
      if (!ids.length) { await say('The BAG is empty.'); return null; }
      const k = await choose(ids.map(id => ({ label: ITEMS[id].n, right: 'x' + G.bag[id] })).concat({ label: 'CANCEL' }), {
        x: 264, y: 16, w: 368, rows: 6,
        extra: (g, i) => { box(g, 8, H - 120, W - 16, 112); const id = ids[i]; wrap(id ? ITEMS[id].d : 'Close the BAG.', 35).forEach((l, j) => text(g, l, 36, H - 90 + j * 36, 16)); },
      });
      if (k < 0 || k >= ids.length) return null;
      const id = ids[k], it = ITEMS[id];
      if (it.ball) {
        if (!battle) { await say('There\'s no wild POKéMON to catch here!'); continue; }
        return { type: 'item', id };
      }
      const t = await partyMenu('item', battle);
      if (t == null) continue;
      const m = G.party[t];
      const ok = alive(m) && (it.heal ? m.hp < m.st.hp : !!m.status);
      if (!ok) { await say('It won\'t have any effect.'); continue; }
      if (battle) return { type: 'item', id, target: t };
      useItem(id); SFX.heal();
      if (it.heal) { const h = Math.min(it.heal, m.st.hp - m.hp); m.hp += h; await say(`${mname(m)}'s HP was restored by ${h} points.`); }
      else { m.status = null; m.slp = 0; await say(`${mname(m)} was cured of its status problem!`); }
    }
  } finally { remove(bg); }
}

class DexScene {
  constructor(res) { this.res = res; this.i = 0; this.top = 0; }
  update(dt, top) {
    if (!top) return;
    const n = DEX_ORDER.length, old = this.i;
    if (Input.hit('up')) this.i = Math.max(0, this.i - 1);
    if (Input.hit('down')) this.i = Math.min(n - 1, this.i + 1);
    if (Input.hit('left')) this.i = Math.max(0, this.i - 8);
    if (Input.hit('right')) this.i = Math.min(n - 1, this.i + 8);
    if (old !== this.i) SFX.blip();
    this.top = clamp(this.top, this.i - 8, this.i);
    if (Input.hit('b')) { SFX.back(); remove(this); this.res(); }
    else if (Input.hit('a')) { const sp = DEX_ORDER[this.i]; if (G.caught[sp]) { SFX.select(); say(SPECIES[sp].txt); } else SFX.bump(); }
  }
  draw(g) {
    menuBg(g, '#c03838', '#d04848');
    const sp = DEX_ORDER[this.i], s = SPECIES[sp], seen = G.seen[sp], caught = G.caught[sp];
    g.fillStyle = '#f8f8f0'; rr(g, 12, 12, 280, 456, 12); g.fill();
    g.fillStyle = '#d8e8d0'; rr(g, 28, 28, 248, 220, 10); g.fill();
    if (seen) drawMon(g, sp, 152, 236, 3.4, { kind: caught ? 'n' : 'k' });
    else text(g, '?', 152, 110, 48, '#a0b0a0', 'center', null);
    text(g, `No.${String(s.dex).padStart(3, '0')}`, 28, 262, 12, '#808080', 'left', null);
    text(g, seen ? s.n : '----------', 28, 286, 14);
    if (caught) {
      s.t.forEach((t, k) => typeBadge(g, t, 28 + k * 104, 316, 96));
      wrap(s.txt, 21).slice(0, 5).forEach((l, j) => text(g, l, 28, 352 + j * 20, 10, '#404040', 'left', null));
    } else text(g, seen ? 'Not caught yet.' : 'Not seen yet.', 28, 320, 10, '#808080', 'left', null);
    g.fillStyle = '#f8f8f0'; rr(g, 304, 12, 324, 456, 12); g.fill();
    text(g, `SEEN ${Object.keys(G.seen).length}  OWN ${Object.keys(G.caught).length}`, 466, 28, 10, '#606060', 'center', null);
    for (let r = 0; r < 9; r++) {
      const k = this.top + r, id = DEX_ORDER[k]; if (!id) break;
      const y = 60 + r * 44;
      if (k === this.i) { g.fillStyle = '#f8d048'; rr(g, 312, y - 6, 308, 36, 8); g.fill(); }
      if (G.caught[id]) drawBall(g, 332, y + 10, .8);
      text(g, String(SPECIES[id].dex).padStart(3, '0'), 350, y + 4, 10, '#606060', 'left', null);
      text(g, G.seen[id] ? SPECIES[id].n : '-----', 400, y + 2, 12);
    }
  }
}
async function startMenu() {
  let start = 0;
  while (true) {
    const opts = ['POKéDEX', 'POKéMON', 'BAG', G.name, 'SAVE', 'EXIT'];
    const i = await choose(opts, { x: W - 236, y: 8, w: 228, start });
    if (i < 0 || i === 5) return;
    start = i;
    if (i === 0) await new Promise(r => push(new DexScene(r)));
    else if (i === 1) await partyMenu('field');
    else if (i === 2) await bagMenu(null);
    else if (i === 3) await trainerCard();
    else if (i === 4) {
      if (await yesNo('Would you like to save the game?')) {
        if (saveGame()) { SFX.heal(); await say(`${G.name} saved the game!`); } else await say('The game could not be saved on this browser.');
      }
    }
  }
}

class QtyScene {
  constructor(max, price, res) { this.transparent = true; this.q = 1; this.max = max; this.price = price; this.res = res; }
  update(dt, top) {
    if (!top) return;
    const old = this.q;
    if (Input.hit('up')) this.q = this.q >= this.max ? 1 : this.q + 1;
    if (Input.hit('down')) this.q = this.q <= 1 ? this.max : this.q - 1;
    if (Input.hit('right')) this.q = Math.min(this.max, this.q + 10);
    if (Input.hit('left')) this.q = Math.max(1, this.q - 10);
    if (old !== this.q) SFX.blip();
    if (Input.hit('a')) { SFX.select(); remove(this); this.res(this.q); }
    else if (Input.hit('b')) { SFX.back(); remove(this); this.res(0); }
  }
  draw(g) {
    box(g, W - 300, H - 216, 292, 88);
    text(g, 'x' + String(this.q).padStart(2, '0'), W - 268, H - 182, 16);
    text(g, '$' + this.q * this.price, W - 36, H - 182, 16, '#303030', 'right');
    tri(g, W - 222, H - 200, 5, '#e04040', 'up'); tri(g, W - 222, H - 152, 5, '#e04040', 'down');
  }
}
async function shop() {
  const wares = ['pokeball', 'greatball', 'potion', 'superpotion', 'fullheal'];
  await say('Hi there! May I help you?');
  while (true) {
    const k = await choose(wares.map(id => ({ label: ITEMS[id].n, right: '$' + ITEMS[id].price })).concat({ label: 'CANCEL' }), {
      x: 200, y: 16, w: 432, size: 14,
      extra: (g, i) => {
        box(g, 8, 16, 184, 76); text(g, 'MONEY', 30, 34, 10, '#808080', 'left', null); text(g, '$' + G.money, 172, 56, 14, '#303030', 'right');
        box(g, 8, H - 120, W - 16, 112); wrap(wares[i] ? ITEMS[wares[i]].d : 'Quit shopping.', 35).forEach((l, j) => text(g, l, 36, H - 90 + j * 36, 16));
      },
    });
    if (k < 0 || k >= wares.length) break;
    const id = wares[k], price = ITEMS[id].price, max = Math.min(99, Math.floor(G.money / price));
    if (max < 1) { await say('You don\'t have enough money.'); continue; }
    const d = new Dialog(`${ITEMS[id].n}? Certainly. How many would you like?`, null, { hold: true });
    await new Promise(r => { d.res = r; push(d); });
    const q = await new Promise(r => push(new QtyScene(max, price, r)));
    remove(d);
    if (!q) continue;
    if (await yesNo(`${ITEMS[id].n}, and you want ${q}. That will be $${q * price}. OK?`)) {
      G.money -= q * price; addItem(id, q); SFX.money();
      await say('Here you are! Thank you!');
    }
  }
  await say('Please come again!');
}
async function pc() {
  SFX.select();
  await say(`${G.name} booted up the PC.`);
  while (true) {
    const i = await ask('Accessed the POKéMON Storage System.', ['WITHDRAW', 'DEPOSIT', 'LOG OFF']);
    const list = arr => arr.map(m => ({ label: mname(m), right: 'Lv' + m.lv })).concat({ label: 'CANCEL' });
    if (i === 0) {
      if (!G.box.length) { await say('There are no POKéMON in the BOX.'); continue; }
      if (G.party.length >= 6) { await say('Your party is full!'); continue; }
      const k = await choose(list(G.box), { x: 176, y: 8, w: 456, rows: 7 });
      if (k >= 0 && k < G.box.length) { const m = G.box.splice(k, 1)[0]; G.party.push(m); await say(`${mname(m)} was taken out. Take good care of it!`); }
    } else if (i === 1) {
      if (G.party.length <= 1) { await say('You can\'t deposit your last POKéMON!'); continue; }
      const k = await choose(list(G.party), { x: 176, y: 8, w: 456 });
      if (k < 0 || k >= G.party.length) continue;
      if (G.party.filter((m, j) => j !== k && alive(m)).length === 0) { await say('You need at least one healthy POKéMON with you!'); continue; }
      const m = G.party.splice(k, 1)[0]; healMon(m); G.box.push(m); await say(`${mname(m)} was stored in the BOX.`);
    } else break;
  }
}

  }));
  Music.play('victory');
  await say(['You conquered the PEWTER CITY GYM!', 'Thanks for playing! Your journey continues - try to catch all the POKéMON in the region!']);
  remove(p);
}
async function blackout() {
  await fadeTo(1, 500);
  G.money = Math.floor(G.money / 2); G.party.forEach(healMon);
  G.x = G.heal.x; G.y = G.heal.y; G.dir = 'down';
  if (ow) ow.zone = zoneAt(G.y);
  await fadeTo(0, 500);
  await say(`${G.name} hurried back to safety, protecting the exhausted POKéMON...`);
}

// ============================================================
//  SAVE / LOAD
// ============================================================
const SAVE_KEY = 'pokemon-kanto-quest-save';
const serMon = m => ({ sp: m.sp, lv: m.lv, xp: m.xp, iv: m.iv, hp: m.hp, status: m.status, slp: m.slp, moves: m.moves });
const deMon = o => { const m = { ...o }; calcStats(m); m.hp = Math.min(m.hp, m.st.hp); return m; };
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...G, party: G.party.map(serMon), box: G.box.map(serMon) })); return true; }
  catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function loadGame() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!o || !o.party || !o.party.length) return false;
    G = { ...o, party: o.party.map(deMon), box: (o.box || []).map(deMon) };
    return true;
  } catch (e) { return false; }
}

// ============================================================
//  TITLE, INTRO, STARTER SELECTION
// ============================================================
let ow = null;
function startOverworld() {
  scenes.length = 0;
  ow = new Overworld(); push(ow); ow.enter();
}
class Title {
  constructor() { this.t = 0; this.busy = false; this.mons = ['pikachu', 'charmander', 'bulbasaur', 'squirtle']; }
  update(dt, top) {
    this.t += dt;
    if (!top || this.busy) return;
    if (Input.hit('a') || Input.hit('start')) { SFX.select(); this.busy = true; titleMenu().finally(() => { this.busy = false; Input.clear(); }); }
  }
  draw(g) {
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2850a0'); bg.addColorStop(1, '#88c8f8'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect((i * 97 + this.t * 20 * (1 + i % 3)) % W, (i * 53) % 260, 2, 2); }
    E(g, W / 2, 470, 420, 140, '#58a848'); E(g, W / 2, 476, 400, 126, '#78c858');
    const by = Math.sin(this.t * 2) * 6;
    for (const [dx, dy, c] of [[-4, 0, '#2850a0'], [4, 0, '#2850a0'], [0, -4, '#2850a0'], [0, 4, '#2850a0'], [4, 6, '#183060']]) text(g, 'POKéMON', W / 2 + dx, 56 + dy + by, 52, c, 'center', null);
    text(g, 'POKéMON', W / 2, 56 + by, 52, '#f8d030', 'center', null);
    text(g, 'KANTO QUEST', W / 2, 128 + by, 18, '#fff', 'center', '#183060');
    const sp = this.mons[Math.floor(this.t / 3) % this.mons.length];
    drawMon(g, sp, W / 2, 380 + Math.abs(Math.sin(this.t * 4)) * -8, 3.2);
    if (!this.busy && Math.floor(this.t * 2) % 2) text(g, 'PRESS START', W / 2, 420, 16, '#fff', 'center', '#183060');
    text(g, 'A fan-made adventure', W / 2, 456, 8, '#e8f8e8', 'center', null);
  }
}
async function titleMenu() {
  const has = hasSave();
  const i = await choose([{ label: 'CONTINUE', disabled: !has }, 'NEW GAME'], { x: W / 2 - 140, y: 300, w: 280, start: has ? 0 : 1 });
  if (i === 0) {
    if (!loadGame()) { await say('The save data could not be loaded.'); return; }
    await fadeTo(1, 300); startOverworld(); await fadeTo(0, 300);
  } else if (i === 1) {
    if (has && !(await yesNo('Start a new game? Your old save will be replaced the next time you save.'))) return;
    await fadeTo(1, 300); newGame('RED'); startOverworld();
    await intro();
  }
}
class IntroScene {
  constructor() { this.who = 'oak'; this.mon = null; this.t = 0; }
  update(dt) { this.t += dt; }
  draw(g) {
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#f8f8f8'); bg.addColorStop(1, '#c8d8e8'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    E(g, W / 2, 330, 160, 30, '#a8b8c8'); E(g, W / 2, 326, 146, 24, '#c8d4e0');
    const x = this.mon ? W / 2 - 110 : W / 2 - 64;
    g.save(); g.translate(x, 196); g.scale(4, 4);
    drawPerson(g, 0, 0, 'down', 0, PAL[this.who], this.who === 'oak'); g.restore();
    if (this.mon) drawMon(g, this.mon, W / 2 + 100, 336 + Math.sin(this.t * 5) * 3, 2.4);
  }
}
class StarterScene {
  constructor(res) { this.res = res; this.i = 1; this.t = 0; this.opts = ['bulbasaur', 'charmander', 'squirtle']; }
  update(dt, top) {
    this.t += dt;
    if (!top) return;
    const old = this.i;
    if (Input.hit('left')) this.i = Math.max(0, this.i - 1);
    if (Input.hit('right')) this.i = Math.min(2, this.i + 1);
    if (old !== this.i) SFX.blip();
    if (Input.hit('a')) { SFX.select(); this.res(this.i); }
  }
  draw(g) {
    menuBg(g, '#d8c8a0', '#e4d6b0');
    g.fillStyle = '#986838'; rr(g, 40, 250, 560, 40, 8); g.fill(); g.fillStyle = '#b88050'; rr(g, 40, 244, 560, 20, 8); g.fill();
    text(g, 'Choose your partner!', W / 2, 30, 16, '#303030', 'center');
    this.opts.forEach((sp, k) => {
      const x = 140 + k * 180, sel = k === this.i;
      if (sel) { E(g, x, 242, 70, 14, 'rgba(248,208,64,.6)'); tri(g, x - 8, 70 + Math.sin(this.t * 6) * 4, 8, '#e04040', 'down'); }
      drawMon(g, sp, x, 248 - (sel ? Math.abs(Math.sin(this.t * 6)) * 10 : 0), sel ? 2.6 : 2.1, { alpha: sel ? 1 : .75 });
    });
    const s = SPECIES[this.opts[this.i]];
    box(g, 8, H - 172, W - 16, 52);
    text(g, s.n, 36, H - 154, 14);
    s.t.forEach((t, k) => typeBadge(g, t, 300 + k * 100, H - 158, 92));
  }
}
async function intro() {
  const s = push(new IntroScene());
  Music.play('town');
  await fadeTo(0, 400);
  await say(['Hello there! Welcome to the world of POKéMON!', 'My name is OAK! People call me the POKéMON PROF!']);
  s.mon = 'pikachu';
  await say(['This world is inhabited by creatures called POKéMON!', 'For some people, POKéMON are pets. Others use them for battles.', 'Myself... I study POKéMON as a profession.']);
  s.mon = null; s.who = 'player';
  const names = ['RED', 'ASH', 'JACK', 'LEAF'];
  G.name = names[Math.max(0, await ask('First, what is your name?', names, { cancel: false }))];
  await say(`Right! So your name is ${G.name}!`);
  s.who = 'rival';
  await say('This is my grandson. He\'s been your rival since you were both babies. ...Erm, what is his name again?');
  const rivals = ['BLUE', 'GARY', 'JOHN'];
  G.rival = rivals[Math.max(0, await ask('Your rival\'s name?', rivals, { cancel: false }))];
  await say(`That's right! I remember now! His name is ${G.rival}!`);
  s.who = 'oak';
  await say([`${G.name}! Your very own POKéMON legend is about to unfold!`, 'But first, you\'ll need a partner. I have three POKéMON here. Go on, choose one!']);
  let pickIdx;
  const st = push(new StarterScene(i => { pickIdx = i; }));
  while (true) {
    pickIdx = null;
    await new Promise(r => { st.res = i => { pickIdx = i; r(); }; });
    const sp = st.opts[pickIdx], kind = { bulbasaur: 'GRASS', charmander: 'FIRE', squirtle: 'WATER' }[sp];
    if (await yesNo(`So! You want the ${kind} POKéMON, ${SPECIES[sp].n}?`)) break;
  }
  remove(st);
  const mine = st.opts[pickIdx], theirs = { bulbasaur: 'charmander', charmander: 'squirtle', squirtle: 'bulbasaur' }[mine];
  const starter = makeMon(mine, 5); G.party = [starter]; registerCaught(starter);
  SFX.caught();
  await say(`${G.name} received a ${SPECIES[mine].n} from PROF. OAK!`);
  s.who = 'rival'; s.mon = theirs;
  await say([`${G.rival}: Then I'll take this one!`, `${G.rival} received a ${SPECIES[theirs].n} from PROF. OAK!`, `${G.rival}: Wait, ${G.name}! Let's check out our POKéMON! Come on, I'll take you on!`]);
  remove(s);
  const r = await startBattle({ trainer: TR(G.rival, 'rival', [[theirs, 5]], 35, '', `${G.rival}: WHAT? Unbelievable! I picked the wrong POKéMON!`, ''), noBlackout: true });
  if (r === 'lose') { await fadeTo(0, 300); await say(`${G.rival}: Yeah! Am I great or what?`); }
  G.party.forEach(healMon);
  await say([`OAK: Your POKéMON fought well! Let me heal it for you.`, `${G.rival}: Smell ya later, ${G.name}! I'm going to be the greatest trainer ever!`,
    `OAK: ${G.name}, head north through ROUTE 1 to VIRIDIAN CITY, then through VIRIDIAN FOREST to PEWTER CITY.`,
    'BROCK, the GYM LEADER of PEWTER, will be a worthy first challenge. Catch POKéMON and train hard!',
    'TIP: Press ENTER (START) to open the menu and SAVE. Hold SHIFT (or B) to run. Visit my LAB anytime!']);
  G.flags.started = 1;
  saveGame();
}

// ============================================================
//  MAIN LOOP
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  updateTweens(dt);
  const top = scenes[scenes.length - 1];
  [...scenes].forEach(s => s.update && s.update(dt, s === top));
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = scenes.length - 1;
  while (i > 0 && scenes[i].transparent) i--;
  for (; i >= 0 && i < scenes.length; i++) scenes[i].draw(ctx);
  if (fadeAlpha > 0.001) { ctx.globalAlpha = fadeAlpha; ctx.fillStyle = fadeColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  Input.clear();
  requestAnimationFrame(frame);
}
push(new Title());
Music.play('route');
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').catch(() => {});
requestAnimationFrame(frame);
</script>
