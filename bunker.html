<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUNKER: Code Red</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
:root{--bg:#050608;--panel:#0c1014;--line:#2a333d;--text:#d8e2ea;--dim:#7d8a96;--green:#3ddc84;--yellow:#ffd23f;--red:#ff3b3b;--black:#c070ff;--cyan:#4fd8ff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;color:var(--text);font-family:'Share Tech Mono',ui-monospace,monospace;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;cursor:none}
.hidden{display:none!important}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,4,4,.82),rgba(0,0,0,.95));z-index:20;padding:16px;overflow:auto}
#screen::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.card{max-width:640px;width:100%;text-align:center}
h1{font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(40px,11vw,86px);letter-spacing:4px;line-height:.95;color:#e9eef2;text-shadow:0 0 30px rgba(255,59,59,.45),0 4px 0 #400}
h1 span{color:var(--red);display:block;font-size:.55em;letter-spacing:10px;margin-top:6px}
h2{font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(30px,8vw,56px);letter-spacing:3px;margin-bottom:8px}
.sub{color:var(--dim);margin:14px 0 22px;font-size:14px;line-height:1.6}
.btn{display:inline-block;font:inherit;font-size:17px;letter-spacing:3px;color:#fff;background:#1a0606;border:2px solid var(--red);padding:12px 26px;margin:6px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 18px rgba(255,59,59,.25) inset}
.btn:hover,.btn:focus{background:var(--red);color:#000;outline:none}
.btn.alt{border-color:var(--line);background:#0c1014;box-shadow:none}
.btn.alt:hover{background:#26303a;color:#fff}
.btn:disabled{opacity:.3;pointer-events:none}
.codes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.code{padding:6px 10px;border:1px solid;font-size:12px;letter-spacing:2px}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 18px;text-align:left;margin:16px auto;width:max-content;max-width:100%;font-size:13px;color:var(--dim)}
.keys b{color:var(--text);font-weight:normal}
.stats{margin:14px auto 20px;display:grid;grid-template-columns:1fr auto;gap:6px 24px;max-width:320px;text-align:left;font-size:15px}
.stats b{color:var(--yellow);font-weight:normal;text-align:right}
#panel{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
.term{background:#071009;border:2px solid #1f6b3a;box-shadow:0 0 40px rgba(61,220,132,.2);padding:18px;width:100%;max-width:330px;color:var(--green)}
.term h3{font-weight:normal;letter-spacing:3px;font-size:14px;margin-bottom:10px;border-bottom:1px dashed #1f6b3a;padding-bottom:8px}
.disp{font-size:38px;letter-spacing:14px;text-align:center;background:#020603;border:1px solid #1f6b3a;padding:10px 0;margin-bottom:6px;min-height:64px;text-shadow:0 0 12px var(--green)}
.disp.err{color:var(--red);border-color:var(--red);text-shadow:0 0 12px var(--red)}
.disp.ok{color:#fff}
.tstat{font-size:12px;text-align:center;margin-bottom:10px;min-height:16px;color:#6fbf8f}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font:inherit;font-size:22px;padding:12px 0;background:#0b1d10;color:var(--green);border:1px solid #1f6b3a;cursor:pointer}
.pad button:hover,.pad button:active{background:#1f6b3a;color:#000}
.pad .x{color:var(--red);border-color:#6b1f1f}
.note{background:#e8e1cf;color:#2a2418;padding:22px 22px 16px;width:100%;max-width:440px;box-shadow:0 10px 40px #000;transform:rotate(-.6deg);font-size:15px;line-height:1.55}
.note h3{font-size:13px;letter-spacing:3px;border-bottom:1px solid #b9ae93;padding-bottom:8px;margin-bottom:12px}
.note .c{background:#2a2418;color:#ffd23f;padding:0 6px;letter-spacing:3px}
.note .btn{border-color:#2a2418;background:#2a2418;box-shadow:none;font-size:13px;padding:8px 16px;margin:14px 0 0}
.data{background:#081018;border:2px solid #1f4f6b;color:#bfe9ff;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow:auto}
.data h3{font-weight:normal;letter-spacing:3px;color:var(--cyan);margin-bottom:12px;font-size:14px}
.data .e{border-left:2px solid #1f4f6b;padding:4px 10px;margin-bottom:10px;font-size:13px;line-height:1.5}
.data .e b{color:#fff;font-weight:normal;letter-spacing:2px;font-size:11px;display:block}
.data .c{color:var(--yellow);letter-spacing:2px}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
.tbtn{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,24,30,.55);color:#fff;font:inherit;font-size:12px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.tbtn:active{background:rgba(255,59,59,.6)}
</style>
</head>

<script>

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- DATA ---------------- */
const WEAPONS = {

  boss:    { name: 'JUGGERNAUT', hp: 1700, r: 26, speed: 72,  dmg: 13, ranged: true, rate: 0.9,  range: 700, bspeed: 380, color: '#ff3b3b', boss: true, score: 500 },
};

const ITEMS = {

  a: { name: 'SMG AMMO +45',      color: '#ffd23f' },
  s: { name: 'SHELLS +8',         color: '#ff8a3d' },
  A: { name: 'LIGHT ARMOR +50',   color: '#4fd8ff' },

};

const DOORKEY = { G: 'green', Y: 'yellow', R: 'red' };

/* ---------------- LEVELS ----------------
   rooms: [x,y,w,h] carved floor. walls: [x,y,w,h] re-filled.
   doors: [x,y,type,arg] type D=auto door (arg 'lock' = seals on CODE RED),
          G/Y/R = keycard door, B = blast gate (arg = gate id), h = emergency hatch (opens on CODE RED)
   terminals: [x,y,gateId]  (code index = gate id)
   notes: [x,y,title,text]  ({c0} full code, {c0a}/{c0b} halves)
------------------------------------------*/
const LEVELS = [
{
  name: 'SECTOR A', sub: 'LIVING QUARTERS', base: 'GREEN', w: 50, h: 21,
  rooms: [[1,1,9,6],[11,1,14,9],[26,1,23,5],[26,7,11,7],[11,11,9,6],[21,11,4,9],[1,8,9,11],[38,7,11,7],[38,15,11,5],[26,15,11,5]],
  doors: [[10,3,'D'],[25,3,'D'],[30,6,'D'],[22,10,'D'],[25,12,'D'],[5,7,'D'],[43,6,'D'],[37,10,'D'],[43,14,'G'],[25,17,'D'],[20,13,'B',0],[20,14,'B',0]],
  player: [4,3], exit: [43,18], exitName: 'ELEVATOR',
  terminals: [[21,12,0]],
  notes: [
    [7,2,'PERSONAL LOG — BUNK 12','Sirens went off at 03:00. PA said CODE GREEN, drill only.\n\nThen the screaming started in the east hall.\n\nIf anyone reads this: the lift down is behind the GREEN door in the south-east. Storage keeps a GREEN keycard.'],
    [31,9,'OFFICE MEMO','To all staff:\n\nThe ARMORY keypad was reset after the incident. New code is {c0}.\n\nDo NOT write this down.\n— Quartermaster Voss'],
  ],
  items: [[2,5,'H'],[18,7,'a'],[36,4,'a'],[14,13,'S'],[17,15,'s'],[13,15,'s'],[12,12,'A'],[46,12,'g'],[3,17,'H'],[8,10,'a'],[7,17,'q'],[33,18,'a'],[16,12,'q']],
  enemies: [[17,4,'grunt'],[33,3,'grunt'],[44,2,'soldier'],[33,12,'grunt'],[5,12,'grunt'],[7,16,'grunt'],[41,11,'soldier'],[47,8,'turret'],[30,17,'grunt'],[34,16,'soldier']],
  toxic: [[2,14,4,3]],
  vents: [[18,3],[40,3],[6,10],[28,18]],
},
{
  name: 'SECTOR B', sub: 'BIOLABS', base: 'YELLOW', w: 56, h: 26,
  rooms: [[1,1,8,6],[10,1,45,3],[10,5,12,8],[23,5,12,8],[36,5,19,8],[36,14,19,5],[10,14,25,5],[10,20,12,5],[23,20,20,5],[44,20,11,5]],
  doors: [[9,2,'D'],[15,4,'D'],[28,4,'D'],[45,4,'D','lock'],[45,13,'h'],[35,16,'Y'],[15,19,'B',0],[16,19,'B',0],[30,19,'D'],[43,22,'R']],
  player: [4,3], exit: [50,22], exitName: 'CARGO LIFT',
  keyTrigger: { yellow: 'RED' },
  terminals: [[13,17,0]],
  notes: [
    [6,5,'SECURITY BRIEFING','ALERT CODES:\n\nGREEN — normal operation.\nYELLOW — intruder suspected.\nRED — LOCKDOWN. Containment doors SEAL. Emergency hatches UNLOCK.\nBLACK — reactor failure. Evacuate.\n\nThree wrong keypad entries trigger CODE RED.'],
    [11,6,'LAB 1 — POST-IT','Vault gate (Server Hall) code: {c0}\n\nThe RED keycard is locked in the vault. Nobody goes in there after what happened to Dr. Hale.'],
  ],
  items: [[20,11,'M'],[12,6,'a'],[33,11,'H'],[50,10,'y'],[53,17,'W'],[38,17,'a'],[48,15,'s'],[15,23,'r'],[19,22,'A'],[11,23,'H'],[33,6,'q'],[25,22,'a'],[40,22,'H'],[20,16,'q'],[7,4,'s']],
  enemies: [[18,8,'soldier'],[12,10,'grunt'],[26,8,'grunt'],[32,10,'grunt'],[30,6,'drone'],[40,2,'grunt'],[52,2,'soldier'],[40,8,'drone'],[48,7,'drone'],[52,6,'soldier'],[42,11,'grunt'],[40,16,'grunt'],[50,16,'grunt'],[22,16,'turret'],[15,15,'soldier'],[28,17,'soldier'],[18,22,'grunt'],[12,21,'grunt'],[30,22,'soldier'],[36,21,'grunt'],[40,23,'drone']],
  toxic: [[38,9,5,3]],
  vents: [[38,15],[52,15],[33,23],[18,16],[24,15]],
},
{
  name: 'SECTOR C', sub: 'REACTOR CORE', base: 'RED', w: 60, h: 34,
  rooms: [[1,14,8,6],[10,3,4,28],[15,1,20,8],[15,25,20,8],[15,10,26,14],[42,12,16,10]],
  walls: [[19,13,2,2],[35,13,2,2],[19,19,2,2],[35,19,2,2],[27,16,2,2]],
  core: [27,16,2,2],
  doors: [[9,16,'D'],[14,4,'D'],[14,28,'D'],[14,16,'B',0],[14,17,'B',0],[41,16,'B',1],[41,17,'B',1]],
  player: [4,16], exit: [55,17], exitName: 'ESCAPE POD', exitNeedsBlack: true,
  terminals: [[12,18,0]],
  notes: [
    [6,15,'EVAC PROTOCOL 7-C','In a CODE BLACK the east blast gate behind the reactor opens automatically.\n\nThe ESCAPE POD is beyond it.\n\nYou will have 100 seconds.'],
    [32,2,'COOLANT LOG','Reactor gate code — part 1 of 2:\n\n{c0a} _ _\n\nPart 2 is with Storage. Coolant pools are corrosive. Wear a suit.'],
    [32,31,'STORAGE LOG','Reactor gate code — part 2 of 2:\n\n_ _ {c0b}\n\nWhatever that thing in the chamber is, it is wearing our reactor shielding.'],
  ],
  items: [[3,15,'H'],[6,18,'a'],[11,6,'s'],[12,26,'a'],[33,7,'W'],[16,2,'q'],[20,30,'Z'],[30,31,'H'],[25,31,'s'],[17,26,'a'],[16,22,'H'],[39,11,'H'],[39,23,'a'],[17,14,'s'],[44,13,'H'],[44,20,'a'],[23,27,'q'],[12,12,'H']],
  enemies: [[12,8,'grunt'],[11,22,'soldier'],[25,2,'drone'],[28,7,'drone'],[33,4,'soldier'],[16,7,'turret'],[30,27,'soldier'],[20,27,'grunt'],[25,30,'grunt'],[33,26,'turret'],[34,17,'boss'],[22,21,'grunt'],[30,12,'grunt'],[50,14,'soldier'],[50,19,'soldier'],[56,13,'turret']],
  toxic: [[18,3,12,4],[16,11,3,2],[37,21,3,2],[28,29,4,2]],
  vents: [[22,11],[33,22],[47,13],[52,20]],
},
];

/* ---------------- STATE ---------------- */
let L = null;          // current level runtime
let P = null;          // player
let G = {              // game
  state: 'menu', level: 0, alert: 'GREEN', calm: 0, meltdown: 0, time: 0,
  banner: null, shake: 0, msgs: [], ventT: 0, carry: null, stats: null, totalStats: null, lastWarn: 0,
};
let bullets = [], particles = [], grenades = [], floaters = [], lights = [];

function newStats() { return { kills: 0, shots: 0, hits: 0, dmg: 0, time: 0 }; }
function defaultCarry() {
  return { hp: 100, armor: 0, hazmat: false, weapons: { pistol: true, shotgun: false, smg: false }, weapon: 'pistol', ammo: { shells: 0, bullets: 0 }, grenades: 1 };
}

/* ---------------- LEVEL BUILD ---------------- */
function genCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

function buildLevel(def, codes) {
  const w = def.w, h = def.h, t = new Uint8Array(w * h);
  for (const [x, y, rw, rh] of def.rooms) for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) t[yy * w + xx] = 1;
  for (const [x, y, rw, rh] of def.walls || []) for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) t[yy * w + xx] = 0;
  const doors = new Map(), doorList = [];
  for (const [x, y, type, arg] of def.doors) {
    const d = { x, y, type, open: 0, locked: type !== 'D', gate: type === 'B' ? arg : null, sealable: arg === 'lock', sealed: false, perm: false, horiz: true, warnT: 0 };
    t[y * w + x] = 2; doors.set(y * w + x, d); doorList.push(d);
  }
  for (const d of doorList) {
    const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : t[y * w + x];
    d.horiz = at(d.x - 1, d.y) !== 1 && at(d.x + 1, d.y) !== 1; // wall runs left-right -> passage is vertical
  }
  const toxic = new Uint8Array(w * h);
  for (const [x, y, rw, rh] of def.toxic || []) for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) toxic[yy * w + xx] = 1;
  codes = codes || def.terminals.map(genCode);
  const fill = s => s.replace(/\{c(\d)\}/g, (_, i) => '⟦' + codes[i] + '⟧').replace(/\{c(\d)a\}/g, (_, i) => '⟦' + codes[i].slice(0, 2).split('').join(' ') + '⟧').replace(/\{c(\d)b\}/g, (_, i) => '⟦' + codes[i].slice(2).split('').join(' ') + '⟧');
  const L = {
    def, w, h, t, doors, doorList, toxic, codes,
    items: def.items.map(([x, y, k]) => ({ x: (x + .5) * TS, y: (y + .5) * TS, k, bob: Math.random() * 6 })),
    enemies: [],
    terminals: def.terminals.map(([x, y, gate]) => ({ x: (x + .5) * TS, y: (y + .5) * TS, gate, code: codes[gate], solved: false, tries: 0 })),
    notes: def.notes.map(([x, y, title, text]) => ({ x: (x + .5) * TS, y: (y + .5) * TS, title, text: fill(text), read: false })),
    vents: (def.vents || []).map(([x, y]) => ({ x: (x + .5) * TS, y: (y + .5) * TS })),
    exit: { x: (def.exit[0] + .5) * TS, y: (def.exit[1] + .5) * TS },
    explored: new Uint8Array(w * h), dist: new Uint16Array(w * h), flowT: 0,
    boss: null, roomLights: def.rooms.map(([x, y, rw, rh]) => ({ x: (x + rw / 2) * TS, y: (y + rh / 2) * TS, r: Math.max(rw, rh) * TS * 0.55 + 60 })),
  };
  for (const [x, y, type] of def.enemies) L.enemies.push(makeEnemy(type, (x + .5) * TS, (y + .5) * TS));
  L.boss = L.enemies.find(e => e.type === 'boss') || null;
  return L;
}

function makeEnemy(type, x, y) {
  const T = ETYPES[type];
  return { type, x, y, hx: x, hy: y, hp: T.hp, maxhp: T.hp, r: T.r, angle: Math.random() * TAU, aware: false, los: false, losT: Math.random() * .2,
    cd: rand(0.4, 1.2), wt: 0, wa: 0, wm: false, strafe: Math.random() < .5 ? 1 : -1, flash: 0, bang: 0, anim: Math.random() * 10,
    phase: 0, patT: 3, pat: 'walk', chargeT: 0, cvx: 0, cvy: 0, summonT: 8, burst: 0, burstT: 0, awakeMsg: false };
}

/* ---------- static level render ---------- */
function prerender() {
  const c = document.createElement('canvas'); c.width = L.w * TS; c.height = L.h * TS;
  const g = c.getContext('2d');
  let seed = 1337 + G.level * 97; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const at = (x, y) => (x < 0 || y < 0 || x >= L.w || y >= L.h) ? 0 : L.t[y * L.w + x];
  g.fillStyle = '#050607'; g.fillRect(0, 0, c.width, c.height);
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const v = at(x, y), px = x * TS, py = y * TS;
    if (v !== 0) {

/* ---------------- FLOW FIELD (enemy pathing) ---------------- */

    case 'S': P.weapons.shotgun = true; P.ammo.shells += 12; P.weapon = 'shotgun'; msg('SHOTGUN acquired — press 2', '#ff8a3d'); break;
    case 'M': P.weapons.smg = true; P.ammo.bullets += 90; P.weapon = 'smg'; msg('SMG acquired — press 3', '#ffd23f'); break;
    case 'q': P.grenades++; break;
    default:
      if (I.key) {
        P.keys[I.key] = true; sfx('key'); banner(I.name, 'ACQUIRED', I.color, 2);
        const trig = L.def.keyTrigger && L.def.keyTrigger[I.key];
        if (trig) setTimeout(() => { if (G.state === 'play') setAlert(trig, 'CONTAINMENT BREACH — LOCKDOWN'); }, 700);
        return true;
      }
  }
  sfx('pick'); floater(it.x, it.y - 10, I.name, I.color);
  return true;
}

function camera() {
  const vw = VW / ZOOM, vh = VH / ZOOM;
  let x = P.x - vw / 2, y = P.y - vh / 2;
  if (!touch.on && G.state === 'play') { x += (mouse.x - VW / 2) / ZOOM * .18; y += (mouse.y - VH / 2) / ZOOM * .18; }
  x = clamp(x, -40, Math.max(-40, L.w * TS - vw + 40)); y = clamp(y, -40, Math.max(-40, L.h * TS - vh + 40));
  if (vw > L.w * TS) x = (L.w * TS - vw) / 2; if (vh > L.h * TS) y = (L.h * TS - vh) / 2;
  if (G.shake > 0) { x += rand(-G.shake, G.shake) / ZOOM * .5; y += rand(-G.shake, G.shake) / ZOOM * .5; }
  return { x, y, w: vw, h: vh };
}

/* ---------------- RENDER ---------------- */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#030405'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!L) return;
  const cam = camera(), s = DPR * ZOOM, now = performance.now() / 1000;
  ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(L.canvas, 0, 0);
  const inView = (x, y, m = 60) => x > cam.x - m && x < cam.x + cam.w + m && y > cam.y - m && y < cam.y + cam.h + m;

  // toxic shimmer
  const x0 = Math.max(0, Math.floor(cam.x / TS)), x1 = Math.min(L.w - 1, Math.ceil((cam.x + cam.w) / TS));
  const y0 = Math.max(0, Math.floor(cam.y / TS)), y1 = Math.min(L.h - 1, Math.ceil((cam.y + cam.h) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (L.toxic[y * L.w + x]) {
    ctx.fillStyle = `rgba(120,255,60,${.12 + .08 * Math.sin(now * 3 + x * .7 + y * 1.3)})`; ctx.fillRect(x * TS, y * TS, TS, TS);
    const bx = (x * 13 + y * 7) % 20, ph = (now * .8 + x * .3 + y * .2) % 1;
    ctx.fillStyle = `rgba(190,255,120,${.5 * (1 - ph)})`; ctx.beginPath(); ctx.arc(x * TS + 6 + bx, y * TS + 8 + ((x * 5 + y * 11) % 16), 1 + ph * 4, 0, TAU); ctx.fill();
  }
  // reactor core
  if (L.def.core) {
    const [cx0, cy0, cw, ch] = L.def.core, cx = (cx0 + cw / 2) * TS, cy = (cy0 + ch / 2) * TS, pul = .5 + .5 * Math.sin(now * (G.alert === 'BLACK' ? 9 : 2.5));
    const col = G.alert === 'BLACK' ? '255,120,40' : '80,220,255';
    ctx.fillStyle = '#0b1116'; ctx.beginPath(); ctx.arc(cx, cy, cw * TS * .55, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(${col},.9)`; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = `rgba(${col},${.5 + .4 * pul})`; ctx.beginPath(); ctx.arc(cx, cy, cw * TS * (.25 + .08 * pul), 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(now * (G.alert === 'BLACK' ? 4 : 1));
    ctx.strokeStyle = `rgba(${col},.7)`; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ctx.beginPath(); ctx.arc(0, 0, cw * TS * .42, 0, .8); ctx.stroke(); }
    ctx.restore();
  }
  // exit
  {
    const ex = L.exit.x, ey = L.exit.y, act = !L.def.exitNeedsBlack || G.alert === 'BLACK', p = (now * 1.2) % 1;
    ctx.strokeStyle = act ? `rgba(79,216,255,${1 - p})` : 'rgba(79,216,255,.25)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ex, ey, 8 + p * 22, 0, TAU); ctx.stroke();
    ctx.fillStyle = act ? '#4fd8ff' : '#2a5560'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText(L.def.exitName, ex, ey + 3);
  }
  // terminals
  for (const t of L.terminals) {
    if (!inView(t.x, t.y)) continue;
    ctx.fillStyle = '#20262d'; ctx.fillRect(t.x - 11, t.y - 13, 22, 26);
    ctx.fillStyle = t.solved ? '#3ddc84' : (Math.sin(now * 6) > 0 ? '#ff3b3b' : '#6b1f1f'); ctx.fillRect(t.x - 8, t.y - 10, 16, 10);
    ctx.fillStyle = '#8a96a3'; for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) ctx.fillRect(t.x - 7 + i * 5, t.y + 3 + j * 4, 3, 2);
  }
  // notes
  for (const n of L.notes) {
    if (!inView(n.x, n.y)) continue;
    ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(.2);
    ctx.fillStyle = n.read ? '#8c8676' : '#efe6cc'; ctx.fillRect(-7, -9, 14, 18);
    ctx.fillStyle = '#6b6352'; for (let i = 0; i < 4; i++) ctx.fillRect(-5, -6 + i * 4, 10, 1);
    ctx.restore();
    if (!n.read) { ctx.strokeStyle = `rgba(255,255,255,${.3 + .3 * Math.sin(now * 4)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(n.x, n.y, 16, 0, TAU); ctx.stroke(); }
  }
  // items
  for (const it of L.items) {
    if (!inView(it.x, it.y)) continue;
    drawItem(it, now);
  }
  // doors
  for (const d of L.doorList) { const cx = (d.x + .5) * TS, cy = (d.y + .5) * TS; if (inView(cx, cy)) drawDoor(d, now); }
  // grenades
  for (const g of grenades) { ctx.fillStyle = '#4a5a2a'; ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, TAU); ctx.fill(); ctx.fillStyle = Math.sin(g.fuse * 30) > 0 ? '#ff3b3b' : '#300'; ctx.fillRect(g.x - 1, g.y - 1, 2, 2); }
  // enemies
  for (const e of L.enemies) if (inView(e.x, e.y)) drawEnemy(e, now);
  // player
  if (G.state !== 'dying' && G.state !== 'dead') drawPlayer(now);
  // bullets
  for (const b of bullets) {
    if (b.team === 'p') { ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .025, b.y - b.vy * .025); ctx.stroke(); }
    else { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .45, 0, TAU); ctx.fill(); }
  }
  // particles
  for (const p of particles) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;

  drawDarkness(cam, now);

  // floaters (above darkness)
  ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
  for (const f of floaters) { ctx.globalAlpha = clamp(f.life, 0, 1); ctx.fillStyle = '#000'; ctx.fillText(f.text, f.x + 1, f.y + 1); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
  for (const e of L.enemies) if (e.bang > 0 && inView(e.x, e.y)) { ctx.fillStyle = '#ff3b3b'; ctx.font = 'bold 18px monospace'; ctx.fillText('!', e.x, e.y - e.r - 10); }
  const ip = G.state === 'play' && nearInteractable();
  if (ip) { ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#000'; ctx.fillRect(P.x - 52, P.y - 42, 104, 16); ctx.fillStyle = '#3ddc84'; ctx.fillText((touch.on ? '[USE] ' : '[E] ') + ip, P.x, P.y - 30); }

  // crosshair
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!touch.on && G.state === 'play') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; const m = mouse, g = 5 + P.kick * 1.5;
    ctx.beginPath(); ctx.moveTo(m.x - g - 7, m.y); ctx.lineTo(m.x - g, m.y); ctx.moveTo(m.x + g, m.y); ctx.lineTo(m.x + g + 7, m.y);
    ctx.moveTo(m.x, m.y - g - 7); ctx.lineTo(m.x, m.y - g); ctx.moveTo(m.x, m.y + g); ctx.lineTo(m.x, m.y + g + 7); ctx.stroke();
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(m.x - 1, m.y - 1, 2, 2);
  }
  drawHUD(now);
}

function drawItem(it, now) {
  const I = ITEMS[it.k], y = it.y + Math.sin(it.bob) * 2;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(it.x, it.y + 9, 9, 3, 0, 0, TAU); ctx.fill();
  const glow = .35 + .25 * Math.sin(now * 4 + it.bob);
  ctx.fillStyle = I.color; ctx.globalAlpha = glow * .4; ctx.beginPath(); ctx.arc(it.x, y, 15, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  const x = it.x;
  switch (it.k) {
    case 'H': ctx.fillStyle = '#eee'; ctx.fillRect(x - 8, y - 6, 16, 12); ctx.fillStyle = '#e0233f'; ctx.fillRect(x - 2, y - 5, 4, 10); ctx.fillRect(x - 5, y - 2, 10, 4); break;
    case 'a': ctx.fillStyle = '#6b5a1f'; ctx.fillRect(x - 7, y - 5, 14, 10); ctx.fillStyle = '#ffd23f'; for (let i = 0; i < 4; i++) ctx.fillRect(x - 6 + i * 3.4, y - 8, 2, 5); break;
    case 's': ctx.fillStyle = '#7a1f12'; ctx.fillRect(x - 7, y - 5, 14, 10); ctx.fillStyle = '#ff8a3d'; for (let i = 0; i < 3; i++) ctx.fillRect(x - 6 + i * 4.5, y - 3, 3, 6); break;
    case 'A': case 'W': case 'Z':
      ctx.fillStyle = I.color; ctx.beginPath(); ctx.moveTo(x - 8, y - 8); ctx.lineTo(x + 8, y - 8); ctx.lineTo(x + 7, y + 4); ctx.lineTo(x, y + 9); ctx.lineTo(x - 7, y + 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x - 1, y - 6, 2, 12); if (it.k === 'Z') { ctx.fillStyle = '#000'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillText('☢', x, y + 3); } break;
    case 'S': ctx.fillStyle = '#5a3a1f'; ctx.fillRect(x - 12, y - 1, 8, 5); ctx.fillStyle = '#9aa4ae'; ctx.fillRect(x - 5, y - 3, 17, 4); break;
    case 'M': ctx.fillStyle = '#333a41'; ctx.fillRect(x - 10, y - 3, 18, 6); ctx.fillStyle = '#9aa4ae'; ctx.fillRect(x - 2, y + 2, 4, 7); ctx.fillRect(x + 8, y - 1, 5, 2); break;
    case 'q': ctx.fillStyle = '#4a5a2a'; ctx.beginPath(); ctx.arc(x, y + 1, 6, 0, TAU); ctx.fill(); ctx.fillStyle = '#9aa4ae'; ctx.fillRect(x - 2, y - 7, 4, 3); break;
    default:
      ctx.fillStyle = I.color; ctx.fillRect(x - 9, y - 6, 18, 12); ctx.fillStyle = '#111'; ctx.fillRect(x - 7, y - 3, 8, 2); ctx.fillStyle = '#fff'; ctx.fillRect(x + 3, y - 4, 4, 4);
  }
}

function drawDoor(d, now) {
  const px = d.x * TS, py = d.y * TS, o = d.open;
  const base = d.sealed ? '#7a1010' : d.type === 'D' ? '#56606c' : d.type === 'B' ? '#6a5a2a' : d.type === 'h' ? '#8a4a12' : KEYCOL[DOORKEY[d.type]];
  ctx.save();
  ctx.beginPath(); ctx.rect(px, py, TS, TS); ctx.clip();
  const half = TS / 2 * (1 - o);
  const drawHalf = (x, y, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    if (d.type === 'B' || d.type === 'h') { ctx.fillStyle = '#ffd23f'; for (let i = -TS; i < TS * 2; i += 10) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.beginPath(); ctx.moveTo(px + i, py); ctx.lineTo(px + i + 5, py); ctx.lineTo(px + i + 5 - TS, py + TS); ctx.lineTo(px + i - TS, py + TS); ctx.fill(); ctx.restore(); } ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x, y, w, h); }
  };
  if (d.type === 'h') { // hatch: shrinks into floor
    const sz = TS * (1 - o) * .9; if (sz > 1) drawHalf(px + (TS - sz) / 2, py + (TS - sz) / 2, sz, sz);
    if (o > .5) { ctx.fillStyle = '#000'; ctx.fillRect(px + 4, py + 4, TS - 8, TS - 8); ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = 2; ctx.strokeRect(px + 4, py + 4, TS - 8, TS - 8); }
  } else if (d.horiz) { drawHalf(px - (TS / 2 - half), py + 4, TS / 2, TS - 8); drawHalf(px + TS / 2 + (TS / 2 - half), py + 4, TS / 2, TS - 8); }
  else { drawHalf(px + 4, py - (TS / 2 - half), TS - 8, TS / 2); drawHalf(px + 4, py + TS / 2 + (TS / 2 - half), TS - 8, TS / 2); }
  ctx.restore();
  // status light
  if (o < .95) {
    const c = d.sealed ? '#ff3b3b' : d.locked ? (DOORKEY[d.type] ? KEYCOL[DOORKEY[d.type]] : '#ff3b3b') : '#3ddc84';
    ctx.fillStyle = c; ctx.globalAlpha = .6 + .4 * Math.sin(now * 5);
    ctx.beginPath(); ctx.arc(px + TS / 2, py + TS / 2, 3, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    if (d.sealed) { ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px + 6, py + 6); ctx.lineTo(px + TS - 6, py + TS - 6); ctx.moveTo(px + TS - 6, py + 6); ctx.lineTo(px + 6, py + TS - 6); ctx.stroke(); }
  }
}

function drawEnemy(e, now) {
  const T = ETYPES[e.type];
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(2, e.r * .6, e.r, e.r * .45, 0, 0, TAU); ctx.fill();
  const fl = e.flash > 0;
  if (e.type === 'grunt') {
    ctx.rotate(e.angle);
    const sw = Math.sin(e.anim * 10) * 4;
    ctx.fillStyle = fl ? '#fff' : '#4f6f1f'; ctx.fillRect(4, -e.r - 1 + sw * .3, 12, 5); ctx.fillRect(4, e.r - 4 - sw * .3, 12, 5);
    ctx.fillStyle = fl ? '#fff' : T.color; ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : '#6a8f2a'; ctx.beginPath(); ctx.arc(-3, -2, 5, 0, TAU); ctx.arc(-2, 5, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff2a2a'; ctx.fillRect(6, -5, 3, 3); ctx.fillRect(6, 2, 3, 3);
  } else if (e.type === 'soldier') {
    ctx.rotate(e.angle);
    ctx.fillStyle = '#222'; ctx.fillRect(6, 1, 16, 4);
    ctx.fillStyle = fl ? '#fff' : '#6b5a3a'; ctx.beginPath(); ctx.ellipse(0, 0, e.r * .8, e.r * 1.1, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : T.color; ctx.beginPath(); ctx.arc(0, 0, e.r * .72, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(1, 0, 5.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(4, -2, 2, 4);
    if (e.flash2 > 0) { ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(24, 3, 4, 0, TAU); ctx.fill(); }
  } else if (e.type === 'drone') {
    const hov = Math.sin(e.anim * 5) * 2; ctx.translate(0, hov - 4);
    ctx.fillStyle = fl ? '#fff' : '#223a4a'; ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = T.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(180,230,255,.6)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) { const a = i * TAU / 4 + Math.PI / 4, rx = Math.cos(a) * 11, ry = Math.sin(a) * 11; ctx.beginPath(); ctx.moveTo(rx - Math.cos(e.anim * 40 + i) * 5, ry - Math.sin(e.anim * 40 + i) * 5); ctx.lineTo(rx + Math.cos(e.anim * 40 + i) * 5, ry + Math.sin(e.anim * 40 + i) * 5); ctx.stroke(); }
    ctx.fillStyle = e.aware ? '#ff3b3b' : '#5cc8ff'; ctx.beginPath(); ctx.arc(Math.cos(e.angle) * 3, Math.sin(e.angle) * 3, 3, 0, TAU); ctx.fill();
  } else if (e.type === 'turret') {
    ctx.fillStyle = fl ? '#fff' : '#3a3f46'; ctx.fillRect(-14, -14, 28, 28);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-14, -14, 6, 3); ctx.fillRect(8, -14, 6, 3); ctx.fillRect(-14, 11, 6, 3); ctx.fillRect(8, 11, 6, 3);
    ctx.rotate(e.angle);
    ctx.fillStyle = '#1c1f23'; ctx.fillRect(4, -3, 20, 6);
    ctx.fillStyle = fl ? '#fff' : T.color; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = e.aware ? '#ff3b3b' : '#3ddc84'; ctx.beginPath(); ctx.arc(3, 0, 2.5, 0, TAU); ctx.fill();
  } else if (e.type === 'boss') {
    ctx.rotate(e.angle);
    const charging = e.pat === 'charge';
    if (charging && e.chargeT > 0) { ctx.strokeStyle = `rgba(255,59,59,${.5 + .5 * Math.sin(now * 40)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, e.r + 8, 0, TAU); ctx.stroke(); }
    ctx.fillStyle = '#1a1c20'; ctx.fillRect(10, -e.r + 2, 26, 9); ctx.fillRect(10, e.r - 11, 26, 9);
    ctx.fillStyle = fl ? '#fff' : '#4a1515'; ctx.beginPath(); ctx.ellipse(0, 0, e.r * .85, e.r * 1.15, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : '#6d6f73'; ctx.beginPath(); ctx.arc(0, 0, e.r * .78, 0, TAU); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : '#8a8c90'; ctx.fillRect(-e.r * .5, -e.r * .9, e.r * .7, e.r * .35); ctx.fillRect(-e.r * .5, e.r * .55, e.r * .7, e.r * .35);
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(4, 0, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = e.hp < e.maxhp * .5 ? '#ff9f1a' : '#ff3b3b'; ctx.fillRect(9, -6, 4, 12);
  }
  ctx.restore();
  if (e.hp < e.maxhp && e.type !== 'boss') {
    ctx.fillStyle = '#000'; ctx.fillRect(e.x - 13, e.y - e.r - 9, 26, 4);
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(e.x - 12, e.y - e.r - 8, 24 * e.hp / e.maxhp, 2);
  }
}

function drawPlayer(now) {
  const W = WEAPONS[P.weapon];
  ctx.save(); ctx.translate(P.x, P.y);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(2, 8, 12, 5, 0, 0, TAU); ctx.fill();
  ctx.rotate(P.angle);
  const k = -P.kick;
  // gun
  ctx.fillStyle = '#15181c'; ctx.fillRect(4 + k, P.weapon === 'shotgun' ? -1 : 0, W.len + 6, P.weapon === 'shotgun' ? 6 : 4);
  if (P.muzzle > 0) { ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(W.len + 12 + k, 2, 6, 0, TAU); ctx.fill(); }
  // arms
  ctx.fillStyle = P.hazmat ? '#c9c21f' : '#3f5566'; ctx.beginPath(); ctx.arc(6 + k, -6, 4, 0, TAU); ctx.arc(8 + k, 6, 4, 0, TAU); ctx.fill();
  // body
  const flash = P.hurt > 0 && Math.sin(now * 60) > 0;
  ctx.fillStyle = flash ? '#fff' : P.hazmat ? '#e8d52a' : '#4b6478'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 12, 0, 0, TAU); ctx.fill();
  if (P.armor > 0) { ctx.fillStyle = P.armor > 100 ? '#2f7dff' : '#4fd8ff'; ctx.fillRect(-7, -11, 8, 5); ctx.fillRect(-7, 6, 8, 5); ctx.fillRect(-5, -4, 5, 8); }
  ctx.fillStyle = flash ? '#fff' : P.hazmat ? '#b5a818' : '#2a3a47'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
  if (P.hazmat) { ctx.fillStyle = '#4fd8ff'; ctx.fillRect(2, -3, 4, 6); }
  ctx.restore();
}

function drawDarkness(cam, now) {
  const A = ALERTS[G.alert], s = DPR * ZOOM / 2; // dark canvas is half-res
  dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, dark.width, dark.height);
  let a = A.dark; if (G.alert === 'BLACK') a -= .08 * Math.random();
  dctx.fillStyle = `rgba(2,3,6,${a})`; dctx.fillRect(0, 0, dark.width, dark.height);
  dctx.globalCompositeOperation = 'destination-out';
  dctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  const hole = (x, y, r, i) => {
    if (x + r < cam.x || x - r > cam.x + cam.w || y + r < cam.y || y - r > cam.y + cam.h) return;
    const g = dctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${i})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.fillRect(x - r, y - r, r * 2, r * 2);
  };

function fitText(t, w) { if (ctx.measureText(t).width <= w) return t; while (t.length > 3 && ctx.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }

function drawMinimap(W, small) {
  const sc = small ? 2 : 3, mw = L.w * sc, mh = L.h * sc, x0 = W - mw - 12, y0 = 12;
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(x0 - 4, y0 - 4, mw + 8, mh + 8);
  ctx.strokeStyle = ALERTS[G.alert].c; ctx.globalAlpha = .6; ctx.strokeRect(x0 - 3.5, y0 - 3.5, mw + 7, mh + 7); ctx.globalAlpha = 1;
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const i = y * L.w + x; if (!L.explored[i]) continue; const v = L.t[i];
    if (v === 1) ctx.fillStyle = L.toxic[i] ? '#2c5a1a' : '#2f3740';
    else if (v === 2) { const d = L.doors.get(i); ctx.fillStyle = d.sealed ? '#ff3b3b' : DOORKEY[d.type] ? KEYCOL[DOORKEY[d.type]] : d.type === 'B' ? '#ff8a3d' : d.type === 'h' ? '#ff8a3d' : '#8a96a3'; }
    else continue;
    ctx.fillRect(x0 + x * sc, y0 + y * sc, sc, sc);
  }
  const ex = Math.floor(L.exit.x / TS), ey = Math.floor(L.exit.y / TS);
  if (L.explored[ey * L.w + ex]) { ctx.fillStyle = '#4fd8ff'; ctx.fillRect(x0 + ex * sc - 2, y0 + ey * sc - 2, sc + 4, sc + 4); }
  for (const t of L.terminals) { const tx = Math.floor(t.x / TS), ty = Math.floor(t.y / TS); if (L.explored[ty * L.w + tx]) { ctx.fillStyle = t.solved ? '#3ddc84' : '#ff3b3b'; ctx.fillRect(x0 + tx * sc - 1, y0 + ty * sc - 1, sc + 2, sc + 2); } }
  for (const it of L.items) if (ITEMS[it.k].key) { const tx = Math.floor(it.x / TS), ty = Math.floor(it.y / TS); if (L.explored[ty * L.w + tx]) { ctx.fillStyle = ITEMS[it.k].color; ctx.fillRect(x0 + tx * sc - 1, y0 + ty * sc - 1, sc + 2, sc + 2); } }
  for (const e of L.enemies) if (e.los) { ctx.fillStyle = '#ff3b3b'; ctx.fillRect(x0 + e.x / TS * sc - 1, y0 + e.y / TS * sc - 1, e.type === 'boss' ? 5 : 3, e.type === 'boss' ? 5 : 3); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x0 + P.x / TS * sc, y0 + P.y / TS * sc, 2.5, 0, TAU); ctx.fill();
}

function objective() {
  const i = G.level;
  if (i === 0) {
    if (!P.keys.green) return L.terminals[0].solved ? 'Find the GREEN keycard (East Storage)' : 'Find the GREEN keycard  •  Armory code is in the Office';
    return 'Take the ELEVATOR behind the GREEN door (south-east)';
  }
  if (i === 1) {
    if (!P.keys.yellow) return 'Retrieve the YELLOW keycard from Containment (east)';
    if (!P.keys.red) return L.terminals[0].solved ? 'Grab the RED keycard from the Vault' : 'LOCKDOWN! Escape by hatch → open the VAULT (code in Lab 1)';
    return 'Reach the CARGO LIFT behind the RED door';
  }
  if (G.alert === 'BLACK') return 'MELTDOWN! Run east to the ESCAPE POD';
  if (!L.terminals[0].solved) return 'Find both code halves (North + South wings) → open the REACTOR gate';
  return 'Destroy the JUGGERNAUT';
}

const panel = document.getElementById('panel');
let panelCtx = null;
function openPanel(html, ctxObj) { panelCtx = ctxObj; panel.innerHTML = html; panel.classList.remove('hidden'); G.state = 'panel'; mouse.down = false; for (const k in keys) keys[k] = false; touch.move = touch.aim = null; }
function closePanel() { panel.classList.add('hidden'); panel.innerHTML = ''; panelCtx = null; if (G.state === 'panel') G.state = 'play'; }
function codeSpans(s) { return s.replace(/⟦(.*?)⟧/g, '<span class="c">$1</span>'); }
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function openCodepad(t) {
  let html = `<div class="term"><h3>▣ BLAST GATE CONTROL — KEYPAD</h3><div class="disp" id="cdisp">____</div><div class="tstat" id="cstat">ENTER 4-DIGIT ACCESS CODE · ${3 - t.tries} TRIES BEFORE ALARM</div><div class="pad">`;
  for (const k of ['1','2','3','4','5','6','7','8','9','CLR','0','ENT']) html += `<button data-k="${k}" class="${k === 'CLR' ? 'x' : ''}">${k}</button>`;
  html += `</div><div style="text-align:center;margin-top:12px"><button class="btn alt" data-k="ESC" style="font-size:12px;padding:8px 16px">EXIT [ESC]</button></div></div>`;
  openPanel(html, { type: 'code', t, input: '' });
  panel.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); codeKey(b.dataset.k); }));
  sfx('beep');
}
function codeKey(k) {
  const c = panelCtx; if (!c || c.type !== 'code' || c.busy) return;
  const disp = document.getElementById('cdisp'), stat = document.getElementById('cstat');
  if (k === 'ESC') { closePanel(); return; }
  if (k === 'CLR') { c.input = ''; sfx('beep'); }
  else if (k === 'ENT') {
    if (c.input.length < 4) { sfx('deny'); return; }
    if (c.input === c.t.code) {
      c.busy = true; disp.className = 'disp ok'; stat.textContent = 'ACCESS GRANTED — GATE OPENING'; sfx('ok');
      c.t.solved = true;
      for (const d of L.doorList) if (d.type === 'B' && d.gate === c.t.gate) { d.locked = false; d.perm = true; }
      setTimeout(() => { closePanel(); msg('BLAST GATE OPEN', '#3ddc84'); shake(5); }, 700);
    } else {
      c.t.tries++; sfx('err'); disp.className = 'disp err'; c.busy = true;
      if (c.t.tries >= 3) {
        stat.textContent = 'SECURITY VIOLATION — ALARM TRIGGERED';
        setTimeout(() => {
          closePanel(); c.t.tries = 0;
          if (ALERTS[G.alert].lvl < 2) setAlert('RED', 'SECURITY VIOLATION AT KEYPAD');
          else { msg('SECURITY VIOLATION — REINFORCEMENTS INBOUND', '#ff3b3b'); sfx('alarm'); for (let i = 0; i < 3; i++) { const v = pick(L.vents); if (v) { const e = makeEnemy(pick(['grunt', 'soldier', 'drone']), v.x, v.y); e.aware = true; L.enemies.push(e); } } }
        }, 800);
      } else {
        stat.textContent = `INVALID CODE · ${3 - c.t.tries} TRIES BEFORE ALARM`;
        setTimeout(() => { c.busy = false; c.input = ''; disp.className = 'disp'; disp.textContent = '____'; }, 700);
      }
    }
    if (!c.busy) return;
  } else if (/^\d$/.test(k) && c.input.length < 4) { c.input += k; sfx('beep'); }
  if (!c.busy) disp.textContent = (c.input + '____').slice(0, 4);
  else if (c.input.length === 4) disp.textContent = c.input;
}
function openNote(n) {
  const first = !n.read; n.read = true;
  if (first) sfx('pick');
  const body = codeSpans(esc(n.text).replace(/\n/g, '<br>'));
  openPanel(`<div class="note"><h3>${esc(n.title)}</h3><div>${body}</div><div style="text-align:right"><button class="btn" id="nclose">CLOSE [E]</button></div></div>`, { type: 'note' });
  document.getElementById('nclose').addEventListener('click', e => { e.stopPropagation(); closePanel(); });

function openDatapad() {
  const read = L.notes.filter(n => n.read);
  let html = `<div class="data"><h3>◈ DATAPAD — ${L.def.name} ${L.def.sub}</h3>`;
  html += `<div class="e"><b>STATUS</b>Alert: <span style="color:${ALERTS[G.alert].c}">${ALERTS[G.alert].label}</span> · Keycards: ${['green','yellow','red'].filter(k => P.keys[k]).map(k => `<span style="color:${KEYCOL[k]}">${k.toUpperCase()}</span>`).join(', ') || 'none'}</div>`;
  html += `<div class="e"><b>OBJECTIVE</b>${esc(objective())}</div>`;

}
function panelKey(e) {
  const k = e.key;
  if (!panelCtx) return;
  e.preventDefault();
  if (panelCtx.type === 'code') {
    if (/^\d$/.test(k)) codeKey(k); else if (k === 'Enter') codeKey('ENT'); else if (k === 'Backspace') { if (!panelCtx.busy) { panelCtx.input = panelCtx.input.slice(0, -1); document.getElementById('cdisp').textContent = (panelCtx.input + '____').slice(0, 4); } }
    else if (k === 'Escape') closePanel(); else if (k.toLowerCase() === 'c') codeKey('CLR');
  } else if (k === 'Escape' || k === 'Enter' || k === ' ' || k.toLowerCase() === 'e' || k === 'Tab') closePanel();
}
panel.addEventListener('click', e => { if (e.target === panel && panelCtx && panelCtx.type !== 'code') closePanel(); });

function getSaved() { try { return +localStorage.getItem('bunker_unlocked') || 0; } catch (e) { return 0; } }

  if (G.state !== 'play') return;
  G.state = 'paused'; stopSiren();
  showScreen(`<div class="card"><h2>PAUSED</h2><p class="sub">${esc(L.def.name)} — ${esc(L.def.sub)}<br>${esc(objective())}</p>
    <button class="btn" data-act="resume">Resume</button><br><button class="btn alt" data-act="retry">Restart Sector</button><button class="btn alt" data-act="menu">Main Menu</button></div>`, ACTIONS.resume);
}
function resume() { hideScreen(); G.state = 'play'; last = performance.now(); }

function startLevel(i) {
  hideScreen(); closePanel();
  G.level = i; G.stats = newStats(); G.msgs = []; G.meltdown = 0; G.ventT = 5; G.calm = 0; G.shake = 0;
  bullets = []; particles = []; grenades = []; floaters = []; lights = [];
  const def = LEVELS[i];
  L = buildLevel(def);
  const c = JSON.parse(JSON.stringify(G.carry || defaultCarry()));
  P = { x: (def.player[0] + .5) * TS, y: (def.player[1] + .5) * TS, r: 11, maxhp: 100, angle: 0, cd: 0, kick: 0, hurt: 0, muzzle: 0, walk: 0, stamina: 1, keys: {}, ...c };
  G.alert = def.base;
  if (ALERTS[G.alert].lvl >= 2) applyLockdown(true);
  prerender(); computeFlow();
  G.state = 'play';
  banner(def.name + ' — ' + def.sub, ALERTS[def.base].label + ' · ' + ALERTS[def.base].desc, ALERTS[def.base].c, 3.5);
  if (i === 0) setTimeout(() => G.state === 'play' && msg('Tip: notes on the floor hold keypad codes. TAB opens your datapad.', '#9aa7b3'), 3800);
  last = performance.now();
}
function levelComplete() {
  addTotals();
  const i = G.level;
  G.carry = { hp: Math.min(100, P.hp + 30), armor: P.armor, hazmat: P.hazmat, weapons: { ...P.weapons }, weapon: P.weapon, ammo: { ...P.ammo }, grenades: P.grenades };
  stopSiren(); sfx('ok');
  if (i === LEVELS.length - 1) { setSaved(i); G.state = 'win'; winScreen(); return; }
  setSaved(i + 1);
  G.state = 'clear';
  const s = G.stats;
  showScreen(`<div class="card"><h2 style="color:#3ddc84">${esc(LEVELS[i].name)} CLEARED</h2><p class="sub">The ${esc(LEVELS[i].exitName.toLowerCase())} groans downward…<br>Next: <b style="color:#fff">${esc(LEVELS[i + 1].name)} — ${esc(LEVELS[i + 1].sub)}</b> · <span style="color:${ALERTS[LEVELS[i + 1].base].c}">${ALERTS[LEVELS[i + 1].base].label}</span></p>
    ${statsHTML(s)}<button class="btn" data-act="next">Continue ▶</button></div>`, ACTIONS.next);
}
function addTotals() { const t = G.totalStats || (G.totalStats = newStats()); for (const k in t) t[k] += G.stats[k]; }
function statsHTML(s) {
  const acc = s.shots ? Math.round(s.hits / s.shots * 100) : 0, tm = Math.floor(s.time);
  return `<div class="stats"><span>TIME</span><b>${Math.floor(tm / 60)}:${String(tm % 60).padStart(2, '0')}</b><span>KILLS</span><b>${s.kills}</b><span>ACCURACY</span><b>${acc}%</b><span>DAMAGE TAKEN</span><b>${Math.round(s.dmg)}</b></div>`;
}
function winScreen() {
  showScreen(`<div class="card"><h1 style="font-size:clamp(34px,9vw,64px)">ESCAPED<span style="color:#4fd8ff">BUNKER 9 IS GONE</span></h1>
    <p class="sub">The escape pod blasts up the shaft seconds before the core detonates. Behind you, the mountain folds in on itself.<br>CODE BLACK — resolved.</p>
    ${statsHTML(G.totalStats)}<button class="btn" data-act="new">Play Again</button><button class="btn alt" data-act="menu">Main Menu</button></div>`, ACTIONS.new);
}
function deathScreen() {
  G.state = 'dead'; stopSiren();
  showScreen(`<div class="card"><h2 style="color:#ff3b3b">${esc(G.dieReason)}</h2><p class="sub">${esc(L.def.name)} — ${esc(L.def.sub)}. The bunker claims another one.</p>
    <button class="btn" data-act="retry">Retry Sector</button><button class="btn alt" data-act="menu">Main Menu</button></div>`, ACTIONS.retry);
}

/* ---------------- LOOP ---------------- */
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (G.state === 'play') update(dt);
  else if (G.state === 'dying') {
    G.dieT -= dt; G.shake = Math.max(0, G.shake - dt * 30);
    for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; if (p.life <= 0) particles.splice(i, 1); }
    if (G.dieT <= 0) deathScreen();
  }
  updateSiren();
  render();
  requestAnimationFrame(frame);
}
window.BUNKER = { LEVELS, buildLevel, G, get L() { return L; }, get P() { return P; }, startLevel, ACTIONS, setAlert };
menu();
requestAnimationFrame(frame);
</script>
</body>
