// tiny tween helper: animate a number on an object, resolve when done
const TWEENS = [];

function updateTweens(dt) { for (let i = TWEENS.length - 1; i >= 0; i--) { const w = TWEENS[i]; w.t += dt * 1000; const k = Math.min(1, w.t / w.d); w.obj[w.key] = w.from + (w.to - w.from) * k; if (k >= 1) { TWEENS.splice(i, 1); w.res(); } } }

/* ---------- sound: a tiny synth, no files ---------- */
let AC = null, master = null, muted = false;
function audioInit() { if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => { }); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); } catch (e) { AC = null; } }
function tone(f, d, type = 'square', v = .05, when = 0, slide = 0) {
  if (!AC || muted || !f) return; const t = AC.currentTime + Math.max(0, when);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0005, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
}
function noise(d, v = .1, when = 0, freq = 1500) {
  if (!AC || muted) return; const t = AC.currentTime + when, len = Math.max(1, Math.floor(AC.sampleRate * d)), b = AC.createBuffer(1, len, AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0005, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}

/* ---------- creature mechanics ---------- */
let UID = 0;
const xpAt = L => Math.floor(.8 * L * L * L);
function statsOf(m) {
  const b = SP[m.sp].base, L = m.lv, st = (B, iv) => Math.floor((2 * B + iv) * L / 100) + 5;
  return { hp: Math.floor((2 * b[0] + m.iv[0]) * L / 100) + L + 10, atk: st(b[1], m.iv[1]), def: st(b[2], m.iv[2]), spd: st(b[3], m.iv[3]) };
}
const maxHP = m => statsOf(m).hp;
const nameOf = m => m.nick || SP[m.sp].name;
const typesOf = m => SP[m.sp].types;
function makeMon(sp, lv) {
  const m = { sp, lv, iv: [0, 1, 2, 3].map(() => randi(0, 15)), xp: xpAt(lv), status: null, moves: [], uid: ++UID };
  const known = []; for (const [l, mv] of SP[sp].learn) if (l <= lv && !known.includes(mv)) known.push(mv);
  m.moves = known.slice(-4); m.hp = maxHP(m); return m;
}
function healMon(m) { m.hp = maxHP(m); m.status = null; }

/* ---------- title + name entry ---------- */

/* ---------- world drawing ---------- */

/* ---------- input ---------- */
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyZ: 'A', Space: 'A', Enter: 'A', KeyE: 'A', KeyX: 'B', Backspace: 'B', KeyQ: 'B', Escape: 'MENU', KeyC: 'MENU', Tab: 'TAB' };
const DIRS = ['up', 'down', 'left', 'right'];
let HITS_TOP = 0;
function dispatch(a) {
  const top = UIS[UIS.length - 1];
  if (top) return top.key(a === 'MENU' ? 'B' : a);
  if (G.mode === 'title') return titleKey(a === 'MENU' ? 'B' : a);
  if (G.mode === 'battle') return battleKey(a === 'MENU' ? 'B' : a);
  if (G.mode === 'world' && !G.lock && !P.mv && G.fade < .01) { if (a === 'A') lockRun(interact); else if (a === 'MENU') mainMenu(); }
}
addEventListener('keydown', e => {
  audioInit(); runHeld = e.shiftKey;
  if (G.mode === 'name') { nameKey(e); return; }
  if (e.code === 'KeyM') { muted = !muted; toast(muted ? 'Sound off' : 'Sound on'); return; }
  const a = KEYMAP[e.code]; if (!a) return;

/* ---------- main loop ---------- */

(document.fonts && document.fonts.load ? document.fonts.load('16px "Press Start 2P"').catch(() => { }) : Promise.resolve()).finally(() => requestAnimationFrame(frame));
