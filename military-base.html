<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IRONGATE: Military Base</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
:root{--bg:#050605;--panel:#0c100b;--line:#2f3628;--text:#dfe5d6;--dim:#86907a;--acc:#d6a93c;--green:#3ddc84;--yellow:#ffd23f;--red:#ff3b3b;--black:#c070ff;--cyan:#4fd8ff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;color:var(--text);font-family:'Share Tech Mono',ui-monospace,monospace;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;cursor:none}
.hidden{display:none!important}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(18,22,8,.84),rgba(0,0,0,.95));z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#screen::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.card{max-width:680px;width:100%;text-align:center;margin:auto}
h1{font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(40px,11vw,86px);letter-spacing:4px;line-height:.95;color:#e9eee0;text-shadow:0 0 30px rgba(214,169,60,.45),0 4px 0 #2a2200}
h1 span{color:var(--acc);display:block;font-size:.5em;letter-spacing:10px;margin-top:6px}
h2{font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(28px,8vw,54px);letter-spacing:3px;margin-bottom:8px}
.sub{color:var(--dim);margin:14px 0 22px;font-size:14px;line-height:1.6}
.btn{display:inline-block;font:inherit;font-size:17px;letter-spacing:3px;color:#fff;background:#191506;border:2px solid var(--acc);padding:12px 24px;margin:6px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 18px rgba(214,169,60,.22) inset}
.btn:hover,.btn:focus{background:var(--acc);color:#000;outline:none}
.btn.alt{border-color:var(--line);background:#0c100b;box-shadow:none}
.btn.alt:hover{background:#262e20;color:#fff}
.btn:disabled{opacity:.3;pointer-events:none}
.lbl{margin:14px 0 4px;color:#86907a;font-size:12px;letter-spacing:2px}
.codes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.code{padding:6px 10px;border:1px solid;font-size:12px;letter-spacing:2px}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 18px;text-align:left;margin:16px auto;width:max-content;max-width:100%;font-size:13px;color:var(--dim)}
.keys b{color:var(--text);font-weight:normal}
.stats{margin:14px auto 20px;display:grid;grid-template-columns:1fr auto;gap:6px 24px;max-width:340px;text-align:left;font-size:15px}
.stats b{color:var(--yellow);font-weight:normal;text-align:right}
#screen,.data{touch-action:pan-y}
#panel{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
.term{background:#071009;border:2px solid #1f6b3a;box-shadow:0 0 40px rgba(61,220,132,.2);padding:18px;width:100%;max-width:330px;color:var(--green)}
.term h3{font-weight:normal;letter-spacing:3px;font-size:14px;margin-bottom:10px;border-bottom:1px dashed #1f6b3a;padding-bottom:8px}
.disp{font-size:38px;letter-spacing:14px;text-align:center;background:#020603;border:1px solid #1f6b3a;padding:10px 0;margin-bottom:6px;min-height:64px;text-shadow:0 0 12px var(--green)}
.disp.err{color:var(--red);border-color:var(--red);text-shadow:0 0 12px var(--red)}
.disp.ok{color:#fff}
.tstat{font-size:12px;text-align:center;margin-bottom:10px;min-height:16px;color:#6fbf8f}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font:inherit;font-size:22px;padding:12px 0;background:#0b1d10;color:var(--green);border:1px solid #1f6b3a;cursor:pointer}
.pad button:hover,.pad button:active{background:#1f6b3a;color:#000}
.pad .x{color:var(--red);border-color:#6b1f1f}
.note{background:#e3dcc4;color:#2a2418;padding:22px 22px 16px;width:100%;max-width:440px;box-shadow:0 10px 40px #000;transform:rotate(-.6deg);font-size:15px;line-height:1.55}
.note h3{font-size:13px;letter-spacing:3px;border-bottom:1px solid #b9ae93;padding-bottom:8px;margin-bottom:12px}
.note .c{background:#2a2418;color:#ffd23f;padding:0 6px;letter-spacing:3px}
.note .btn{border-color:#2a2418;background:#2a2418;box-shadow:none;font-size:13px;padding:8px 16px;margin:14px 0 0}
.data{background:#0a1008;border:2px solid #3d5a2a;color:#d6f0c0;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow:auto}
.data h3{font-weight:normal;letter-spacing:3px;color:var(--acc);margin-bottom:12px;font-size:14px}
.data .e{border-left:2px solid #3d5a2a;padding:4px 10px;margin-bottom:10px;font-size:13px;line-height:1.5}
.data .e b{color:#fff;font-weight:normal;letter-spacing:2px;font-size:11px;display:block}
.data .c{color:var(--yellow);letter-spacing:2px}
#cmd{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));transform:translateX(-50%);z-index:12;background:rgba(8,12,8,.92);border:2px solid var(--acc);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(96vw,760px);cursor:default}
#cmd h4{width:100%;text-align:center;font-weight:normal;letter-spacing:3px;font-size:12px;color:var(--acc);margin-bottom:2px}
#cmd button{font:inherit;font-size:13px;letter-spacing:1px;color:#fff;background:#141a10;border:1px solid #4a5a2a;padding:8px 10px;cursor:pointer}
#cmd button:hover,#cmd button:active{background:var(--acc);color:#000}
#cmd button b{color:var(--acc);margin-right:6px}
#cmd button:hover b{color:#000}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
.tbtn{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,24,16,.55);color:#fff;font:inherit;font-size:11px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.tbtn:active{background:rgba(214,169,60,.6)}
</style>
</head>

<canvas id="c"></canvas>
<div id="touch" class="hidden">
  <button class="tbtn" id="tUse" style="right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px))">USE</button>

</div>

<div id="screen"><div class="card"><h1>IRONGATE<span>MILITARY BASE</span></h1><p class="sub">Loading…<br><br>If this screen stays like this, the app you opened it in can't run games (for example the iPhone Files preview).<br>Open it in Safari or Chrome instead.</p></div></div>

<script>
'use strict';
/* =========================================================
   IRONGATE — top-down military base infiltration / defense
   ========================================================= */
const TS = 32;

const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(safeProbe);
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.floor(VW * DPR); cv.height = Math.floor(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px'; // CSS size = screen size, backing store = screen * DPR
  dark.width = Math.ceil(cv.width / 2); dark.height = Math.ceil(cv.height / 2);
  BASEZOOM = Math.max(0.55, Math.min(1.3, VW / (TS * 17), VH / (TS * 13.5)));
  ZOOM = BASEZOOM;
  const cs = getComputedStyle(safeProbe);
  SAFE = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function turnTo(a, b, m) { const d = angDiff(a, b); return a + clamp(d, -m, m); }
const fmtT = t => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

/* ---------------- ALERT CODES ---------------- */

const NOBODY = new Set(['camera', 'turret', 'drone']); // these leave wreckage, not bodies

/* ---------------- DIFFICULTY ----------------
   TIERS are the AI operators (your squad, the rookies, and the intruder squad).
   GDIFF scales the base personnel when you are the one sneaking in. */
const TIERS = [
  { name: 'ROOKIE', stars: 0, hp: 220, speed: 165, spread: .08,  react: .25, rate: .13, dmg: 10.5, lead: true,  nades: 2, sight: 500, armor: .12,   color: '#c9c08a' },
  { name: 'EASY',   stars: 1, hp: 150, speed: 155, spread: .13,  react: .42, rate: .16, dmg: 9,  lead: false, nades: 0, sight: 440, armor: 0,   color: '#3ddc84', time: 150 },
  { name: 'MID',    stars: 2, hp: 210, speed: 162, spread: .09,  react: .3,  rate: .13, dmg: 10, lead: false, nades: 1, sight: 480, armor: .1,  color: '#ffd23f', time: 180 },
  { name: 'HARD',   stars: 3, hp: 290, speed: 170, spread: .06,  react: .2,  rate: .11, dmg: 11, lead: true,  nades: 2, sight: 520, armor: .15, color: '#ff8a3d', time: 210 },
  { name: 'ELITE',  stars: 4, hp: 420, speed: 167, spread: .04,  react: .18, rate: .115, dmg: 11.5, lead: true, nades: 2, sight: 570, armor: .2,  color: '#ff3b3b', time: 240 },

const GDIFF = [null,
  { hp: .8,   dmg: .6,  detect: .7,  acc: 1.4, alarm: 1.4 },
  { hp: 1,    dmg: .8,  detect: 1,   acc: 1,   alarm: 1 },

const ALLY_NAMES = ['VIPER', 'GHOST', 'SABER'], ROOKIE_NAMES = ['SGT. COLE', 'SGT. REYES', 'SGT. NOVAK'];
// Defend: the intruder ARMY — two squads, each with a bot leader (both leaders have exactly the same stats) and four troopers
const ARMY = [
  { name: 'SHADOW', sq: 0, lead: true }, { name: 'RAVEN', sq: 0 }, { name: 'WRAITH', sq: 0 }, { name: 'HEX', sq: 0 }, { name: 'ONYX', sq: 0 },

const ITEMS = {

/* ---------------- LEVELS ----------------
   rooms: [x,y,w,h] floor.  walls: [x,y,w,h] wall.  deco: [x,y,w,h,kind] props (solid ones become walls).

const SOLID_DECO = new Set(['truck', 'jeep', 'crate', 'container', 'sandbag', 'tree', 'barrier', 'table', 'bunk', 'rack', 'gunrack', 'desk', 'gen', 'missile', 'pillar', 'holo']);
function genCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

function buildLevel(def, codes, gd) {
  const w = def.w, h = def.h, t = new Uint8Array(w * h), fence = new Uint8Array(w * h), decoMask = new Uint8Array(w * h), ground = new Uint8Array(w * h);

  for (const r of def.rooms) fill(r, 1);
  for (const r of def.fence || []) fill(r, 0, fence);
  for (const r of def.walls || []) fill(r, 0);
  const decos = [];
  for (const [x, y, rw, rh, kind] of def.deco || []) {
    decos.push({ x, y, w: rw, h: rh, kind });
    if (SOLID_DECO.has(kind)) fill([x, y, rw, rh], 0, decoMask);
    else if (kind === 'road' || kind === 'tarmac') for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) ground[yy * w + xx] = kind === 'road' ? 1 : 2;
  }
  for (const r of def.carve || []) fill(r, 1);
  for (const r of def.carve2 || []) fill(r, 1);
  for (const d of decos) if (SOLID_DECO.has(d.kind)) fill([d.x, d.y, d.w, d.h], 0, decoMask); // props inside carved huts stay solid
  const doors = new Map(), doorList = [];
  for (const [x, y, type, arg] of def.doors) {
    const d = { x, y, type, open: 0, locked: type !== 'D', gate: type === 'B' ? arg : null, sealable: arg === 'lock', sealed: false, perm: false, horiz: true, warnT: 0 };
    t[y * w + x] = 2; fence[y * w + x] = 0; doors.set(y * w + x, d); doorList.push(d);
  }

    const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : t[y * w + x];

  const L = {

    enemies: [], bodies: [],

const panel = document.getElementById('panel');

function openPanel(html, ctxObj) { panelCtx = ctxObj; panel.innerHTML = html; panel.classList.remove('hidden'); G.state = 'panel'; mouse.down = false; for (const k in keys) keys[k] = false; touch.move = touch.aim = null; }
function closePanel() { panel.classList.add('hidden'); panel.innerHTML = ''; panelCtx = null; if (G.state === 'panel') G.state = 'play'; }
function codeSpans(s) { return s.replace(/⟦(.*?)⟧/g, '<span class="c">$1</span>'); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function openCodepad(t) {
  let html = `<div class="term"><h3>▣ ACCESS CONTROL — KEYPAD</h3><div class="disp" id="cdisp">____</div><div class="tstat" id="cstat">ENTER 4-DIGIT CODE · ${3 - t.tries} TRIES BEFORE ALARM</div><div class="pad">`;
  for (const k of ['1','2','3','4','5','6','7','8','9','CLR','0','ENT']) html += `<button data-k="${k}" class="${k === 'CLR' ? 'x' : ''}">${k}</button>`;
  html += `</div><div style="text-align:center;margin-top:12px"><button class="btn alt" data-k="ESC" style="font-size:12px;padding:8px 16px">EXIT [ESC]</button></div></div>`;
  openPanel(html, { type: 'code', t, input: '' });

function codeKey(k) {
  const c = panelCtx; if (!c || c.type !== 'code' || c.busy) return;
  const disp = document.getElementById('cdisp'), stat = document.getElementById('cstat');
  if (k === 'ESC') { closePanel(); return; }

  else if (k === 'ENT') {
    if (c.input.length < 4) { sfx('deny'); return; }
    if (c.input === c.t.code) {
      c.busy = true; disp.className = 'disp ok'; stat.textContent = 'ACCESS GRANTED'; sfx('ok');
      c.t.solved = true;
      for (const d of L.doorList) if (d.type === 'B' && d.gate === c.t.gate) { d.locked = false; d.perm = true; }
      setTimeout(() => { if (panelCtx === c) closePanel(); msg('GATE OPEN', '#3ddc84'); shake(5); }, 700);
    } else {
      c.t.tries++; sfx('err'); disp.className = 'disp err'; c.busy = true;
      if (c.t.tries >= 3) {
        stat.textContent = 'SECURITY VIOLATION — ALARM TRIGGERED';
        const lvl = L;
        setTimeout(() => { c.t.tries = 0; if (L !== lvl) return; if (panelCtx === c) closePanel(); if (ALERTS[G.alert].lvl < 2) setAlert('RED', 'SECURITY VIOLATION AT A KEYPAD', P.x, P.y); else { msg('SECURITY VIOLATION — REINFORCEMENTS INBOUND', '#ff3b3b'); G.spawnT = 0; } }, 800);
      } else {
        stat.textContent = `INVALID CODE · ${3 - c.t.tries} TRIES BEFORE ALARM`;
        setTimeout(() => { c.busy = false; c.input = ''; disp.className = 'disp'; disp.textContent = '____'; }, 700);
      }
    }
    if (!c.busy) return;

}

function panelKey(e) {
  const k = e.key;
